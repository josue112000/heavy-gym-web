<style>
@font-face{font-family:"Poppins";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/poppins-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"Poppins";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/poppins-latin-600-normal.woff2) format("woff2")}@font-face{font-family:"Poppins";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/poppins-latin-700-normal.woff2) format("woff2")}@font-face{font-family:"Poppins";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/poppins-latin-800-normal.woff2) format("woff2")}@font-face{font-family:"Lato";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lato-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Lato";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/lato-latin-700-normal.woff2) format("woff2")}@font-face{font-family:"Lato";font-style:normal;font-weight:900;font-display:swap;src:url(fonts/lato-latin-900-normal.woff2) format("woff2")}

/* Layout: app de una columna (máx. 720 px) con pestañas fijas abajo y temporizador flotante encima.
   Paleta: negro puro, superficies grafito y un solo acento verde; las superseries se marcan con el acento. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --surface: #1b1b1c;
  --surface-2: #262628;
  --line: #2e2e30;
  --fg: #ffffff;
  --muted: #9a9a9e;
  --dim: #6b6b70;
  --acc: #2fee80;
  --acc-ink: #03160b;
  --acc-soft: rgba(47, 238, 128, 0.12);
  --acc-line: rgba(47, 238, 128, 0.38);
  --ok: #2fee80;
  --bad: #ff6b5e;
  --scrim: rgba(0, 0, 0, 0.7);
  --nav-bg: rgba(0, 0, 0, 0.96);
  --photo: #ffffff;
  --meta: #ffcf4a;
  --f-display: "Poppins", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Lato", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --r: 12px;
  --nav-h: 58px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button, [data-a] { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(var(--nav-h) + 110px + env(safe-area-inset-bottom, 0px));
}
.stack { display: grid; gap: 14px; }
.stack-s { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap-ok { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
p { margin: 0; }

/* Tipografía */
.eyebrow {
  font-family: var(--f-display); font-weight: 600; font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--acc); margin: 0;
}
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-weight: 800; font-size: 27px; line-height: 1.1; letter-spacing: -0.01em; }
h2 { font-weight: 700; font-size: 19px; line-height: 1.2; }
h3 { font-weight: 600; font-size: 15px; line-height: 1.25; }
.sec-t {
  font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted); margin: 10px 0 0;
}

/* Encabezado */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg);
  padding-block: 10px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid transparent;
}
.top.line { border-bottom-color: var(--line); }
.top .grow h1 { font-size: 19px; font-weight: 700; }
.elapsed { font-family: var(--f-display); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.back { background: none; border: 0; color: var(--acc); font-family: var(--f-display); font-weight: 600; padding: 0 6px 4px 0; font-size: 34px; line-height: 1; min-width: 32px; min-height: 44px; }

/* Botones y chips */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 16px; border-radius: 10px;
  font-family: var(--f-display); font-weight: 600; font-size: 14px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--fg);
}
.btn.primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: rgba(226, 127, 102, 0.45); background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.lnk { background: none; border: 0; padding: 8px 2px; color: var(--acc); font-family: var(--f-display); font-weight: 600; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; min-height: 34px; padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 13px;
}
.chip.on { border-color: var(--acc); color: var(--acc); background: var(--acc-soft); }
.pill {
  display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 6px;
  background: var(--surface-2); color: var(--muted); font-size: 12px; font-family: var(--f-display); font-weight: 500;
}
.pill.acc { background: var(--acc-soft); color: var(--acc); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { min-height: 42px; background: transparent; border: 0; border-left: 1px solid var(--line); color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 13px; }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--acc); color: var(--acc-ink); }

/* Tarjetas */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.card.hero { padding: 18px 16px; background: var(--surface); border-color: var(--acc-line); }
.list { display: grid; }
.list > * + * { border-top: 1px solid var(--line); }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.li:first-child { border-top: 0; }
.li .k { flex: none; }
.li-t { min-width: 0; flex: 1; display: grid; gap: 2px; }
.li-t b { font-weight: 700; font-size: 15px; }
.li-t span { color: var(--muted); font-size: 13px; }
.li-t b .pill { font-size: 10.5px; padding: 1px 6px; vertical-align: 2px; }
.chev { color: var(--dim); font-size: 18px; }

/* Semana */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.wd { display: grid; justify-items: center; gap: 4px; padding: 4px 0; background: none; border: 0; color: var(--muted); }
.wd b { font-family: var(--f-display); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.wd span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-variant-numeric: tabular-nums; font-size: 15px; color: var(--fg); font-family: var(--f-display); font-weight: 600; }
.wd i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.wd.hecho i { background: var(--acc); }
.wd.hoy span { background: var(--acc); color: var(--acc-ink); }
.wd.off span { color: var(--dim); }

/* Ejercicio en sesión */
.k {
  display: inline-grid; place-items: center; min-width: 30px; height: 26px; padding: 0 6px; border-radius: 7px;
  background: var(--surface-2); color: var(--acc); font-family: var(--f-display); font-weight: 700; font-size: 12px;
}
.ss { background: var(--acc-soft); border: 1px solid var(--acc-line); border-radius: calc(var(--r) + 4px); padding: 8px; display: grid; gap: 8px; }
.ss-h { display: flex; justify-content: space-between; gap: 8px; padding: 2px 6px 0; }
.ss .k { background: var(--acc); color: var(--acc-ink); }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 8px; display: grid; gap: 10px; min-width: 0; }
.ex-h { display: flex; gap: 10px; align-items: flex-start; }
.ex-t { flex: 1; min-width: 0; display: grid; gap: 3px; }
.ex-t .sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.star { color: var(--acc); font-size: 16px; line-height: 1.4; }
.nota { color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.flag { font-family: var(--f-display); font-weight: 600; font-size: 12px; color: var(--acc); }
.tec {
  display: inline-flex; align-items: center; padding: 1px 6px; margin: 0 1px; border-radius: 5px; vertical-align: 1px;
  background: var(--acc-soft); border: 1px solid var(--acc-line); color: var(--acc);
  font-family: var(--f-display); font-weight: 600; font-size: 11px; line-height: 1.5;
}
.tec.off { opacity: 0.45; }
.info { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.info b { color: var(--fg); font-weight: 700; }
.info.up { background: var(--acc-soft); color: var(--fg); }
.info.up b { color: var(--acc); }

.sets { display: grid; gap: 6px; }
.sr { display: grid; grid-template-columns: 58px minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.75fr) 46px; gap: 6px; align-items: center; }
.sr.hd { font-family: var(--f-display); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
.sr.hd span { text-align: center; }
.sr.hd span:first-child { text-align: left; }
.sl { display: grid; line-height: 1.15; }
.sl b { font-family: var(--f-display); font-weight: 700; font-size: 14px; }
.sl small { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.cell { display: grid; gap: 1px; min-width: 0; }
.cell em { font-style: normal; text-align: center; font-size: 10.5px; color: var(--dim); min-height: 13px; font-variant-numeric: tabular-nums; }
.n {
  width: 100%; height: 46px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg);
  text-align: center; font-size: 17px; font-family: var(--f-display); font-weight: 600; font-variant-numeric: tabular-nums;
  padding: 0 4px; color: var(--fg);
}
.n::placeholder { color: var(--dim); font-weight: 500; }
.chk {
  width: 46px; height: 46px; border-radius: 9px; border: 1px solid var(--line); background: transparent;
  color: var(--dim); font-size: 20px; font-weight: 700; display: grid; place-items: center;
}
.sr.done .n { border-color: var(--acc-line); background: var(--acc-soft); }
.sr.done .chk { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.sr.t-cal .sl b, .sr.t-rampa .sl b { color: var(--muted); font-size: 12.5px; }
.ex-f { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 2px; }
textarea.ta {
  width: 100%; min-height: 70px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg);
  color: var(--fg); padding: 10px; font-size: 14px; resize: vertical;
}

/* Animaciones de ejercicios: sprite de 2 cuadros (inicio | final) */
.anim { position: relative; overflow: hidden; width: 100%; border-radius: 10px; background: var(--photo); }
.anim img { position: absolute; top: 0; left: 0; width: 200%; height: 100%; max-width: none; animation: cuadros 1.8s steps(1, end) infinite; }
.anim.still img { animation: none; }
.anim.big { border-radius: 12px; }
@keyframes cuadros { 0% { transform: translateX(0); } 50% { transform: translateX(-50%); } 100% { transform: translateX(-50%); } }
.thumb { flex: none; width: 96px; padding: 0; border: 0; background: none; border-radius: 10px; }
.mini { flex: none; width: 58px; }
.mini .anim { border-radius: 7px; }
.mini.vacio { height: 1px; }
@media (min-width: 700px) { .thumb { width: 150px; } }

/* Búsqueda */
.search { position: relative; }
.search input {
  width: 100%; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 44px 0 14px; font-size: 16px; color: var(--fg);
}
.search input:focus { border-color: var(--acc); outline: none; }
.search .x { position: absolute; right: 6px; top: 6px; width: 38px; height: 38px; border: 0; background: none; color: var(--muted); font-size: 20px; }
.sel {
  height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 0 10px; font-size: 14px; min-width: 0; max-width: 100%;
}
.filters { display: grid; gap: 8px; }
.filters .row { gap: 8px; }
.filters .row .sel { flex: 1; }
.hl { color: var(--acc); }
.res { display: grid; }
.res-g { margin-top: 14px; }

/* Rutina */
.cover { padding: 22px 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; display: grid; gap: 8px; }
.cover h1 { font-size: 40px; letter-spacing: -0.02em; }
.cover .per { font-family: var(--f-display); font-weight: 500; font-size: 18px; color: var(--fg); }
.cover .rule { width: 64px; height: 3px; background: var(--acc); border-radius: 2px; margin: 4px 0; }
.dia-h { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 14px 0; text-align: left; }
.dia-h .d { font-family: var(--f-display); font-weight: 700; color: var(--acc); font-size: 14px; width: 40px; flex: none; }
.dia-h .t { flex: 1; min-width: 0; display: grid; gap: 1px; }
.dia-h .t b { font-family: var(--f-display); font-weight: 600; font-size: 15.5px; }
.dia-h .t span { color: var(--muted); font-size: 12.5px; }
.dia-b { padding: 0 0 16px; display: grid; gap: 10px; }
.slot { display: grid; grid-template-columns: 36px 1fr; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); }
.slot.in-ss { background: var(--acc-soft); border-radius: 8px; padding: 10px 8px; border-top: 0; margin-top: 2px; }
.slot .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.why { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; font-size: 13.5px; color: var(--muted); }
.why b { color: var(--fg); }
.tbl-w { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 420px; }
.tbl th { text-align: left; font-family: var(--f-display); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; background: var(--surface-2); }
.tbl td { padding: 9px 12px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tbl tr.cur td { background: var(--acc-soft); }
.tbl td.c, .tbl th.c { text-align: center; }
.def { display: grid; grid-template-columns: 112px 1fr; gap: 4px 12px; font-size: 13.5px; }
.def dt { font-weight: 700; color: var(--fg); }
.def dd { margin: 0 0 8px; color: var(--muted); }

/* Progreso */
.bars { display: grid; gap: 10px; }
.bar-r { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13.5px; }
.bar-r .v { font-variant-numeric: tabular-nums; color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 13px; }
.track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.fill { height: 100%; background: var(--acc); border-radius: 3px; }
.fill.full { background: var(--ok); }
.chart { width: 100%; height: auto; display: block; }
.chart .ax { fill: var(--muted); font-size: 10.5px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; fill: none; }
.chart .ln { stroke: var(--acc); stroke-width: 2.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .meta { stroke: var(--meta); stroke-width: 1.6; stroke-dasharray: 6 6; fill: none; }
.chart .meta-t { fill: var(--meta); font-size: 10.5px; font-family: var(--f-display); font-weight: 600; }
.chart .ar { fill: rgba(255, 255, 255, 0.05); stroke: none; }
.chart .pt { fill: var(--acc); stroke: none; }
.chart .pt.crudo { fill: var(--muted); opacity: 0.7; }
.chart .pt.last { fill: var(--acc); stroke: var(--bg); stroke-width: 3; }
.banner { border: 1px dashed var(--acc-line); color: var(--acc); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.empty { text-align: left; padding: 22px 18px; }
.empty ul { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv div { background: var(--surface-2); border-radius: 10px; padding: 10px; display: grid; gap: 2px; }
.kv b { font-family: var(--f-display); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kv span { font-size: 11.5px; color: var(--muted); }

/* Ajustes */
.set-g { display: grid; gap: 10px; }
.set-r { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tog { width: 52px; height: 30px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); position: relative; flex: none; }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform 0.15s; }
.tog.on { background: var(--acc); border-color: var(--acc); }
.tog.on::after { transform: translateX(22px); background: var(--acc-ink); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
.dot.ok { background: var(--ok); }
.dot.wait { background: var(--acc); }
.dot.bad { background: var(--bad); }

/* Navegación */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--nav-bg);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tab {
  height: var(--nav-h); background: none; border: 0; color: var(--muted);
  font-family: var(--f-display); font-weight: 600; font-size: 11px; display: grid; justify-items: center; align-content: center; gap: 3px; padding: 0 2px;
}
.tab svg { display: block; }
.tab.on { color: var(--acc); }
.tab-c { background: none; border: 0; color: var(--muted); display: grid; justify-items: center; gap: 3px; padding: 0 0 7px; font-family: var(--f-display); font-weight: 600; font-size: 11px; }
.tab-c .disco { width: 58px; height: 58px; border-radius: 50%; background: var(--acc); color: var(--acc-ink); display: grid; place-items: center; margin-top: -24px; box-shadow: 0 0 0 5px var(--bg); }
.tab-c.on, .tab-c.live { color: var(--acc); }
.tab-c.live .disco { animation: latido 1.8s ease-in-out infinite; }
@keyframes latido { 50% { box-shadow: 0 0 0 5px var(--bg), 0 0 0 11px var(--acc-soft); } }

/* Temporizador */
.timer {
  position: fixed; z-index: 19;
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 10px);

legar al RIR indicado, baja ≈25–30% la carga sin descansar y sigue al fallo. [DS×2] = dos bajadas.","Moderada. Misma hipertrofia que las series normales, en ½ a ⅓ del tiempo (Sødal 2023)."],"RP":["Rest-pause / myo-reps","Tras la serie, 15 s de pausa y otra mini-serie con el mismo peso al fallo. Myo-reps: mini-series de 3–5 reps.","Moderada. Igual que las series normales (Enes 2021); ventaja pequeña en un meta-análisis de 2026 (débil)."],"PE":["Parciales en estiramiento","Tras la última rep completa, sigue con medias reps en la parte donde el músculo está más estirado.","Moderada. En entrenados igualan al rango completo (Wolf 2025), así que aquí se usan para extender la serie, no para reemplazarla."],"ISO":["Isometría en estiramiento","Sostén la carga 10 s en la posición más estirada que controles.","Moderada a débil. La isometría en posición larga dio más hipertrofia que en posición corta (Oranchuk 2019)."],"SS":["Superserie o descanso activo","Alternas dos ejercicios de músculos que no compiten: el descanso de uno es el trabajo del otro.","Moderada. Misma hipertrofia en sesiones más cortas; con antagonistas salen más reps (Zhang 2025)."],"BÑ":["Bañuelos 2.0","El protocolo de prensa de Gustavo Bañuelos, ajustado a la evidencia: 2 reps lentas, isometría abajo, reps al fallo y parciales abajo.","Práctica de coach, armada con piezas que sí tienen respaldo (fallo, isometría en estiramiento)."]},"dias":[{"dow":1,"nombre":"Lunes","corto":"LUN","titulo":"Pecho + Bíceps","extra":"+ deltoide lateral","min":75,"series":21,"ej":[{"k":"1","op":[{"ej":"press_inclinado_maquina","var":"","l":"Máquina"},{"ej":"press_inclinado_smith","var":"30°","l":"Smith 30°"}],"t":"Press inclinado en máquina o Smith (≈30°)","aprox":true,"s":[{"n":4,"reps":"6–10","rir":"2 → 1","tipo":"ef"}],"d":"3 min","nota":"Baja hasta sentir el estiramiento del pecho, sin rebote. Solo la última serie a RIR 1.","star":false,"cu":false,"tempo":"3-1-X","tec":[]},{"k":"2","op":[{"ej":"press_plano_mancuernas","var": <script>

const KG_LB = 2.20462262;

const VOL_FILAS = [

  ["Deltoide lateral", ["deltoides_lat"]],
  ["Deltoide posterior", ["deltoides_post"]],

];

const TEC_RE = /\[(DS×2|DS|RP|PE|ISO|SS|BÑ|NEG|CL)\]/g;
/* Técnicas que el editor puede prender en cada ejercicio (SS se arma uniendo dos ejercicios) */
const TEC_ORDEN = ["DS", "DS×2", "RP", "PE", "ISO", "NEG", "CL", "BÑ"];
const TEC_EXTRA = {
  NEG: ["Negativas lentas", "En la última serie baja cada repetición en 4–5 s; al final puedes pedir ayuda para subir y seguir solo con la bajada.", "Práctica común para alargar la serie con control. Hay poca evidencia de que dé más músculo que una serie normal con el mismo esfuerzo."],
  CL: ["Series cluster", "Parte la serie en bloques de pocas reps con 15–30 s de pausa entre bloques, con la misma carga.", "Crecimiento parecido al de las series normales con el mismo volumen; sirve para mover cargas altas con mejor técnica."],
};

/* ───────── Texto y búsqueda ───────── */
function norm(s) {
  return String(s || "")
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}
function stem(w) {
  if (w.length > 4 && w.endsWith("es")) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith("s")) return w.slice(0, -1);
  return w;
}
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function tokenMatch(q, w) {
  // q: palabra buscada, w: palabra del término. 3 = prefijo exacto, 2 = misma raíz, 1 = parecida
  if (w.startsWith(q)) return 3;
  const qs = stem(q), ws = stem(w);
  if (ws.startsWith(qs) || qs === ws) return 2;
  if (q.length >= 4) {
    const max = q.length >= 7 ? 2 : 1;
    const cut = w.slice(0, Math.max(q.length, ws.length));
    if (lev(qs, ws, max) <= max || lev(q, cut, max) <= max) return 1;
  }
  return 0;
}

function buildIndex(cat) {
  const grupo = Object.fromEntries(cat.grupos.map((g) => [g.id, g.nombre]));
  const musc = Object.fromEntries(cat.musculos.map((m) => [m.id, m.nombre]));
  const equipo = Object.fromEntries(cat.equipo.map((q) => [q.id, q.nombre]));
  return cat.ejercicios.map((e, orden) => {
    const terms = [{ raw: e.nombre, w: 1, kind: "nombre" }];
    e.sinonimos.forEach((s) => terms.push({ raw: s, w: 0.92, kind: "sinonimo" }));
    e.variantes.forEach((v) => terms.push({ raw: e.nombre + " " + v, w: 0.85, kind: "variante", v }));
    e.grupos.forEach((g) => terms.push({ raw: grupo[g], w: 0.5, kind: "aux" }));
    if (e.principal) terms.push({ raw: musc[e.principal], w: 0.55, kind: "aux" });
    e.equipo.forEach((q) => terms.push({ raw: equipo[q], w: 0.45, kind: "aux" }));
    terms.forEach((t) => { t.n = norm(t.raw); t.words = t.n.split(" "); });
    return { id: e.id, orden, terms };
  });
}

function scoreTerm(qn, qwords, t) {
  if (t.n === qn) return 100;
  if (t.n.startsWith(qn)) return 85;
  if (qn.length >= 3 && t.n.includes(qn)) return 70;
  let sum = 0;
  for (const q of qwords) {
    let best = 0;
    for (const w of t.words) { const m = tokenMatch(q, w); if (m > best) best = m; if (best === 3) break; }
    if (!best) return 0;
    sum += best;
  }
  return 25 + (sum / (qwords.length * 3)) * 35;
}

function search(index, q, limit, preferidos) {
  const qn = norm(q);
  if (!qn) return [];
  const qwords = qn.split(" ").filter(Boolean);
  const out = [];
  for (const item of index) {
    let best = 0, match = null;
    for (const t of item.terms) {
      const s = scoreTerm(qn, qwords, t) * t.w;
      if (s > best) { best = s; match = t; }
    }
    if (best > 0 && preferidos && preferidos.has(item.id)) best += 4;
    if (best > 0) out.push({ id: item.id, orden: item.orden, score: best, match: match.kind === "nombre" || match.kind === "aux" ? null : match.raw, v: match.v || null });
  }
  out.sort((a, b) => b.score - a.score || a.orden - b.orden);
  return limit ? out.slice(0, limit) : out;
}

/* ───────── Prescripción ───────── */
function parseRest(d) {
  if (!d) return 0;
  const s = String(d).trim();
  let m = s.match(/^(\d+):(\d{2})/);
  if (m) return +m[1] * 60 + +m[2];
  m = s.match(/^(\d+(?:\.\d+)?)\s*min/);
  if (m) return Math.round(+m[1] * 60);
  m = s.match(/^(\d+)\s*s/);
  if (m) return +m[1];
  return 0;
}
function parseRange(reps) {
  const m = String(reps || "").match(/(\d+)\s*[–-]\s*(\d+)/);
  if (m) return { min: +m[1], max: +m[2] };
  const n = String(reps || "").match(/^(\d+)$/);
  if (n) return { min: +n[1], max: +n[1] };
  return null;
}
function rirFila(rir, i, n) {
  const m = String(rir || "").match(/^(\S+)\s*→\s*(\S+)$/);
  if (m) return i === n - 1 ? m[2] : m[1];
  return rir || "";
}

function semanaInfo(rutina, fecha, ajusteSemana) {
  const [y, mo, d] = rutina.inicio.split("-").map(Number);
  const inicio = new Date(y, mo - 1, d);
  const hoy = new Date(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
  const dias = Math.round((hoy - inicio) / 864e5);
  let n = Math.floor(dias / 7) + 1;
  let estado = "en";
  if (dias < 0) { estado = "antes"; n = 1; }
  else if (n > rutina.semanasTotal) { estado = "despues"; }
  if (ajusteSemana && ajusteSemana !== "auto") { n = +ajusteSemana; estado = "fija"; }
  const sem = estado === "despues" ? null : rutina.semanas[n - 1];
  return { n: estado === "despues" ? null : n, estado, faltan: -dias, sem };
}

function prescripcion(slot, n, sem) {
  // sem = la semana del bloque ({rirFijo, star, descarga}); sin semana, la rutina tal como está escrita
  const w = sem || {};
  const grupos = slot.s.map((g) => ({ ...g }));
  const efTotal = grupos.filter((g) => g.tipo === "ef").reduce((a, g) => a + g.n, 0);
  let extra = false, descarga = false;
  const last = [...grupos].reverse().find((g) => g.tipo === "ef");
  if (slot.star && w.star && last) {
    last.n += 1; extra = true;
  }
  if (w.descarga) {
    descarga = true;
    let quitar = efTotal - Math.ceil(efTotal / 2);
    for (let i = grupos.length - 1; i >= 0 && quitar > 0; i--) {
      if (grupos[i].tipo !== "ef") continue;
      const q = Math.min(quitar, grupos[i].n);
      grupos[i].n -= q; quitar -= q;
    }
  }
  const filas = [];
  let ef = 0;
  for (const g of grupos) {
    for (let i = 0; i < g.n; i++) {
      let rir = g.tipo === "ef" ? rirFila(g.rir, i, g.n) : "";
      if (g.tipo === "ef" && w.rirFijo) rir = w.rirFijo;
      const label = g.tipo === "cal" ? "Cal" : g.tipo === "rampa" ? "Rampa" : String(++ef);
      filas.push({ tipo: g.tipo, label, reps: g.reps, rir });
    }
  }
  return { filas, efectivas: filas.filter((f) => f.tipo === "ef").length, extra, descarga };
}

function codigos(nota) {
  return [...String(nota || "").matchAll(TEC_RE)].map((m) => m[1]);
}
function grupoSS(k) {
  return /^[A-Z]\d$/.test(k) ? k[0] : null;
}

/* ───────── Unidades ───────── */
function redondear(x, paso) { return Math.round(x / paso) * paso; }
function num(x) {
  if (x === null || x === undefined || x === "") return null;
  const v = parseFloat(String(x).replace(",", "."));
  return Number.isFinite(v) ? v : null;
}
function fmtN(x, dec) {
  if (x === null || x === undefined || !Number.isFinite(x)) return "";
  return String(Number(x.toFixed(dec === undefined ? 2 : dec)));
}
function kgA(unidad, kg) { return unidad === "lb" ? kg * KG_LB : kg; }
function aKg(unidad, v) { return unidad === "lb" ? v / KG_LB : v; }
function fmtPeso(kg, pref) {
  if (kg === null || kg === undefined) return "";
  if (pref === "lb") return fmtN(kg * KG_LB, 1) + " lb";
  if (pref === "ambos") return fmtN(kg) + " kg · " + fmtN(kg * KG_LB, 1) + " lb";
  return fmtN(kg) + " kg";
}
function fmtDist(km, pref) {
  if (km === null || km === undefined) return "";
  return pref === "mi" ? fmtN(km / 1.609344, 2) + " mi" : fmtN(km, 2) + " km";
}
function e1rm(kg, reps) {
  if (!kg || !reps) return null;
  return kg * (1 + reps / 30);
}

/* ───────── Historial ───────── */
function esEfectiva(s) {

  const CAMPOS = {

  function pieHTML(i, ejId) {

  /* Tus últimas veces con este ejercicio (semana pasada, antepasada…) y qué te falta para ganarles */

  function tablaHTML(i, st, reg, ph) {

  function empezar(dow, forzar, rid) {
    const R = (rid && rutinaPorId(rid)) || RUT;
    if (S.act && S.act.dow === dow && S.act.bloque === R.id && !forzar) { go("sesion"); return; }
    if (S.act && !forzar) { S.sheet = { tipo: "cambiar", dow, rid: R.id }; renderSheet(); return; }

    S.act = {
      id: uid(), bloque: R.id, dow, semana: si.n, inicio: new Date().toISOString(), unidad: S.aj.peso === "lb" ? "lb" : "kg",
      diaDef: clon(d), semDef: sem ? clon(sem) : null,
      slots: d.ej.map((sl) => ({ opt: 0, nota: "", filas: prescripcion(sl, si.n, sem).filas.map(filaNueva) })),
      extras: [], timer: null,

  /* Sesión fuera de la rutina, solo para cardio (caminadora, escaladora, box…) */

    const now = new Date(), dw = DOWS.find((x) => x[0] === now.getDay());
    S.act = {
      id: uid(), bloque: RUT.id, dow: now.getDay(), semana: null, inicio: now.toISOString(), unidad: S.aj.peso === "lb" ? "lb" : "kg", fuera: true,

  function filaNueva(f) { return Object.assign({}, f, { p: "", r: "", q: "", s: "", m: "", d: "", fc: "", hecha: false }); }

  function marcar(i, j) {
    const b = bloque(i), f = b.st.filas[j];
    if (f.hecha) { f.hecha = false; saveAct(); render(); return; }
    const reg = EJ[b.ej].registro, campos = (CAMPOS[reg] || CAMPOS.peso_reps).filter(Boolean);
    const { ph } = previos(b), prevS = ph[j];
    for (const [k] of campos) {

        if (v !== "" && v != null) f[k] = String(v);

    const falta = campos.find(([k, , req]) => req && num(f[k]) == null);

      toast("Escribe " + falta[1].toLowerCase() + " para marcar la serie");

      if (el) el.focus();
      return;
    }
    f.hecha = true; f.t = Date.now();
    desbloquearAudio();
    saveAct();
    descansoTras(i, f);
    const kg = num(f.p) != null ? aKg(pu(), num(f.p)) : null, rp = num(f.r);
    if (kg && rp && f.tipo !== "cal" && f.tipo !== "rampa") {
      const prev = eventosRecord(S.ses).mejores.get(b.ej + "|" + (b.v || ""));
      const v = e1rm(kg, rp);
      const otras = b.st.filas.filter((x, jj) => jj !== j && x.hecha && num(x.p) != null && num(x.r) != null).map((x) => e1rm(aKg(pu(), num(x.p)), num(x.r)));
      if (prev && v > prev.v + 0.01 && v > Math.max(0, ...otras) + 0.01) toast("¡Récord! 1RM est. " + fmtN(kgA(pu(), v), 1) + " " + pu() + " (antes " + fmtN(kgA(pu(), prev.v), 1) + ")");

  function descansoTras(i, f) {
    if (String(i).startsWith("x")) {
      const x = S.act.extras[+String(i).slice(1)];
      if (x && EJ[x.ej] && EJ[x.ej].registro === "cardio") return; // después del cardio no hay descanso
      iniciarDescanso(S.aj.descanso, "Descanso"); return;
    }
    const d = diaAct(), sl = d.ej[+i], g = grupoSS(sl.k);

      const pos = miembros.findIndex((o) => o.idx === +i);

      const rest = Math.max(...miembros.map((o) => parseRest(o.s.d)));

  function construirSesion() {
    const a = S.act, d = diaAct(), fin = new Date();
    const serie = (f, reg) => {
      const o = { tipo: f.tipo };
      const p = num(f.p), r = num(f.r), q = num(f.q), s = num(f.s), m = num(f.m), di = num(f.d), fc = num(f.fc);
      if (p != null) o.peso = Math.round(aKg(a.unidad, p) * 10000) / 10000;
      if (r != null) o.reps = r;
      if (q != null) o.rir = q;
      if (s != null) o.seg = s;
      if (m != null) o.min = m;
      if (di != null) o.dist = Math.round((S.aj.dist === "mi" ? di * 1.609344 : di) * 1000) / 1000;

      const st = a.slots[i], op = sl.op[st.opt] || sl.op[0], reg = EJ[op.ej].registro;
      const series = st.filas.filter((f) => f.hecha).map((f) => serie(f, reg));
      if (series.length) entradas.push({ slot: slotId(a.dow, sl.k, a.bloque), k: sl.k, ej: op.ej, var: op.var || "", nombre: sl.t, series, nota: st.nota || "" });
    });
    a.extras.forEach((x) => {
      const series = x.filas.filter((f) => f.hecha).map((f) => serie(f, EJ[x.ej].registro));
      if (series.length) entradas.push({ slot: null, k: "+", ej: x.ej, var: x.var || "", nombre: nombreEj(x.ej, x.var), series, nota: x.nota || "" });
    });
    const o = {
      id: a.id, v: 1, bloque: a.bloque, semana: a.semana, dia: a.dow, diaTitulo: d.titulo, ...(a.fuera ? { fuera: true } : {}),
      inicio: a.inicio, fin: fin.toISOString(), min: Math.max(1, Math.round((fin - new Date(a.inicio)) / 60000)), entradas,
    };

    if (a.fuera) o.min = Math.max(o.min, minCardio(o));

  }
  function records(ses, base) {

      if (!top.length) continue;
      const cur = Math.max(...top.map((s) => e1rm(s.peso, s.reps)));
      let prev = 0;
      for (const s of base) for (const x of s.entradas) {
        if (x.ej !== e.ej || (x.var || "") !== (e.var || "")) continue;
        for (const y of x.series) if (y.peso && y.reps && y.tipo !== "cal" && y.tipo !== "rampa") prev = Math.max(prev, e1rm(y.peso, y.reps));
      }
      if (prev && cur > prev + 0.01) out.push({ nombre: e.nombre, cur, prev });
    }
    return out;
  }

  /* Número grande con flecha de cambio; bajarEsBueno decide si el cambio se pinta verde o rojo */
  function grande(v, unidad, delta, bajarEsBueno, lado, dec) {
    const dd = dec == null ? 1 : dec;
    let dl = "";
    if (delta != null && Math.abs(delta) >= 0.05) {

      dl = `<span class="delta ${bien === true ? "bien" : bien === false ? "mal" : ""}">${delta < 0 ? "↓" : "↑"} ${esc(fmtN(Math.abs(delta), dd))}</span>`;
    }
    return `<div class="big-row"><span class="big num">${esc(fmtN(v, dd))}${unidad ? `<small>${esc(unidad)}</small>` : ""}</span>${dl}${lado ? `<span class="small muted lado">${esc(lado)}</span>` : ""}</div>`;
  }

  /* Gráfica de línea con degradado, eje de tiempo real, etiquetas a la derecha y línea de meta punteada */
  let gradN = 0;
  function pasoBonito(r) {
    const p = Math.pow(10, Math.floor(Math.log10(r))), f = r / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function chartSVG(pts, o) {
    o = o || {};
    if (!pts.length) return `<p class="ph">${esc(o.vacio || "Sin datos todavía.")}</p>`;
    const W = 380, H = Math.round((o.alto || 200) * 0.66), L0 = 4, R0 = 34, T0 = 14, B0 = 20;
    const ts = pts.map((p) => +new Date(p.t));
    let t0 = Math.min(...ts), t1 = Math.max(...ts);
    if (t1 - t0 < 4 * 864e5) { t0 -= 2 * 864e5; t1 += 2 * 864e5; }
    const all = pts.map((p) => p.y).concat(o.meta != null ? [o.meta] : []).concat(o.linea ? o.linea.map((p) => p.y) : []);
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = Math.max((hi - lo) * 0.14, Math.abs(hi) * 0.008, 0.5); lo -= pad; hi += pad;
    const X = (t) => L0 + ((t - t0) / (t1 - t0)) * (W - L0 - R0);
    const Y = (v) => T0 + (1 - (v - lo) / (hi - lo)) * (H - T0 - B0);
    const paso = pasoBonito((hi - lo) / 3);
    const ticks = [];
    for (let v = Math.ceil(lo / paso) * paso; v <= hi + 1e-9; v += paso) ticks.push(v);
    const id = "hg" + (++gradN);
    // Con `linea` (tendencia) la curva es la tendencia y los registros quedan como puntos
    const LP = o.linea && o.linea.length ? o.linea : pts, lts = LP.map((p) => +new Date(p.t));
    const line = LP.map((p, i) => `${i ? "L" : "M"}${X(lts[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
    const area = `${line} L${X(lts[lts.length - 1]).toFixed(1)},${H - B0} L${X(lts[0]).toFixed(1)},${H - B0} Z`;
    const etq = (v) => (o.fmt ? o.fmt(v) : fmtN(v, paso < 1 ? 1 : 0));
    const et = [], span = t1 - t0;
    if (span > 50 * 864e5) {
      const d = new Date(t0); d.setDate(1); d.setHours(0, 0, 0, 0); d.setMonth(d.getMonth() + 1);
      while (+d <= t1) { et.push([+d, cap(MESES[d.getMonth()])]); d.setMonth(d.getMonth() + 1); }
    } else {
      for (let i = 0; i < 4; i++) { const t = t0 + (span * i) / 3; et.push([t, fechaCorta(new Date(t).toISOString())]); }
    }
    const salto = Math.max(1, Math.ceil(et.length / 6));
    const lx = X(lts[lts.length - 1]), ly = Y(LP[LP.length - 1].y);
    const cx = (x) => Math.min(Math.max(x, L0 + 18), W - R0 - 18);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titulo || "Gráfica")}">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:0.34"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs>
      ${ticks.map((v) => `<line class="grid" x1="${L0}" x2="${W - R0}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="ax" x="${W - R0 + 6}" y="${(Y(v) + 4).toFixed(1)}">${esc(etq(v))}</text>`).join("")}
      ${LP.length > 1 ? `<path d="${area}" fill="url(#${id})" stroke="none"/><path class="ln" d="${line}"/>` : ""}
      ${o.linea ? pts.map((p, i) => `<circle class="pt crudo" cx="${X(ts[i]).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.2"/>`).join("") : ""}
      ${o.meta != null ? `<line class="meta" x1="${L0}" x2="${W - R0}" y1="${Y(o.meta).toFixed(1)}" y2="${Y(o.meta).toFixed(1)}"/>${o.metaTxt ? `<text class="meta-t" x="${L0 + 4}" y="${(Y(o.meta) - 7).toFixed(1)}">${esc(o.metaTxt)}</text>` : ""}` : ""}
      ${o.puntos && !o.linea ? pts.slice(0, -1).map((p, i) => `<circle class="pt" cx="${X(ts[i]).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6"/>`).join("") : ""}
      <circle class="pt last" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5"/>
      ${et.filter((_, i) => i % salto === 0).map(([t, l]) => `<text class="ax" x="${cx(X(t)).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`).join("")}
    </svg>`;
  }
  function spark(pts) {
    if (!pts || pts.length < 2) return '<span class="spark"></span>';
    const W = 84, H = 28, ys = pts.map((p) => p.y);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
    const d = ys.map((v, i) => `${i ? "L" : "M"}${((i * (W - 4)) / (ys.length - 1) + 2).toFixed(1)},${(H - 3 - ((v - lo) / (hi - lo)) * (H - 6)).toFixed(1)}`).join(" ");
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}"/></svg>`;
  }

      <div class="card set-g"><h3>Semana del bloque</h3><p class="small muted">${esc(RUT.nombre)}: en automático la calcula por fecha (arranca el ${esc(fechaLarga(inicioBloque()))}). Fíjala si quieres probar otra semana.</p>
      <div class="chips">${["auto", ...RUT.semanas.map((w) => w.n)].map((v) => `<button class="chip ${String(ajSemana()) === String(v) ? "on" : ""}" data-a="aj" data-k="semana" data-v="${v}">${v === "auto" ? "Automática" : "Sem. " + v}</button>`).join("")}</div></div>
      <div class="card set-g"><h3>Guardado</h3><p>${nube[0]}</p>${nube[1] ? `<p class="small muted">${nube[1]}</p>` : ""}${pend ? `<p class="small muted">${pend} ${pend === 1 ? "sesión pendiente" : "sesiones pendientes"} de subir.</p>` : ""}
      <p class="small muted">${S.ses.length} ${S.ses.length === 1 ? "sesión guardada" : "sesiones guardadas"}.</p>
      <div class="row wrap-ok"><button class="btn sm" data-a="respaldo">${NAT ? "Compartir respaldo" : "Copiar respaldo"}</button><button class="btn sm ghost" data-a="restaurar">Restaurar respaldo</button></div>`;
    if (S.ui.respaldo) h += `<textarea class="ta" id="txt-respaldo" readonly>${esc(JSON.stringify(respaldo()))}</textarea><p class="small dim">Selecciona todo el texto y cópialo en una nota o correo para ti.</p>`;
    if (S.ui.restaurar) h += `<textarea class="ta" id="txt-restaurar" data-in="restore" placeholder="Pega aquí tu respaldo">${esc(S.ui.restoreTxt)}</textarea>

    h += `</div>
      ${cardSalud()}

      <p class="small dim">Heavy Gym ${VERSION}${NAT ? " para Android" : ""} · ${CAT.ejercicios.length} ejercicios · ${esc(RUT.nombre)} · ${esc(periodoTxt(RUT))}</p>

  function respaldo() {
    const limpio = (o) => { const { _pend, ...r } = o; return r; };
    return { app: "heavy-gym", v: 3, exportado: new Date().toISOString(), ajustes: S.aj, sesiones: S.ses.map(limpio), cuerpo: S.cuerpo.map(limpio),
      rutinas: S.rutinas.filter((r) => r.editada || r.id !== RUT0.id).map(limpio), reloj: S.reloj };
  }
  function restaurarDesde(txt) {
    let obj;
    try { obj = JSON.parse(txt); } catch (e) { toast("Ese texto no es un respaldo válido"); return; }
    const lista = Array.isArray(obj) ? obj : obj && obj.sesiones;
    if (!Array.isArray(lista) && !(obj && (Array.isArray(obj.cuerpo) || Array.isArray(obj.rutinas)))) { toast("No encontré datos en ese respaldo"); return; }
    const ids = new Set(S.ses.map((s) => s.id));
    const nuevas = (lista || []).filter((s) => s && typeof s.id === "string" && /^[A-Za-z0-9_\-.~:@+]+$/.test(s.id) && Array.isArray(s.entradas) && !ids.has(s.id));
    nuevas.forEach((s) => { s._pend = true; S.ses.push(s); });
    saveSes();
    const idsC = new Set(S.cuerpo.map((x) => x.id));
    const nuevosC = (obj && Array.isArray(obj.cuerpo) ? obj.cuerpo : []).filter((x) => x && typeof x.id === "string" && /^[A-Za-z0-9_\-.~:@+]+$/.test(x.id) && /^\d{4}-\d{2}-\d{2}$/.test(x.fecha || "") && !idsC.has(x.id));
    nuevosC.forEach((x) => { x._pend = true; S.cuerpo.push(x); });
    saveCuerpo();
    (async () => { for (const x of nuevosC) await subirC(x); })();
    (async () => { for (const s of nuevas) await subir(s); renderSafe(); })();
    // Rutinas: entra la que no tengas o la que esté editada más recientemente
    let nR = 0;
    for (const r of (obj && Array.isArray(obj.rutinas) ? obj.rutinas : [])) {
      if (!r || typeof r.id !== "string" || !/^[A-Za-z0-9_\-.~:@+]+$/.test(r.id) || !r.inicio || !Array.isArray(r.dias)) continue;
      const i = S.rutinas.findIndex((x) => x.id === r.id);
      if (i < 0) { S.rutinas.push(normalizarRutina(r)); nR++; }
      else if ((r.editada || "") > (S.rutinas[i].editada || "")) { S.rutinas[i] = normalizarRutina(r); nR++; }
    }
    if (nR) { S.rutinasSemilla = false; saveRut(); S.rutinas.forEach((r) => { if (r.editada) subirR(r); }); }
    const nW = unirReloj(obj && Array.isArray(obj.reloj) ? obj.reloj : []);
    S.ui.restaurar = false; S.ui.restoreTxt = "";
    const partes = [nuevas.length ? nuevas.length + (nuevas.length === 1 ? " sesión" : " sesiones") : "", nuevosC.length ? nuevosC.length + " registros de cuerpo" : "", nR ? nR + (nR === 1 ? " rutina" : " rutinas") : "", nW ? nW + " entrenamientos del reloj" : ""].filter(Boolean);
    toast(partes.length ? "Restauré " + partes.join(", ") : "Ese respaldo no trae datos nuevos");
    render();
  }

  /* ───────── Hojas ───────── */
  function renderSheet() {
    const el = document.getElementById("sheet");
    if (!S.sheet) { el.innerHTML = ""; return; }
    const sh = S.sheet;
    let body = "";
    if (sh.tipo === "tec") {
      const [nm, como, ev] = tecDe(sh.c) || [sh.c, "", ""];
      body = `<div class="sheet-h"><div><p class="eyebrow">Técnica · ${esc(sh.c)}</p><h2>${esc(nm)}</h2></div>${xBtn()}</div>
        ${sh.off ? `<div class="banner"><span>Esta semana va sin técnicas: haz la serie normal.</span></div>` : ""}
        <p>${esc(como)}</p><p class="small muted"><b>Evidencia:</b> ${esc(ev)}</p>`;
    } else if (sh.tipo === "ej") body = hojaEj(sh.id);
    else if (sh.tipo === "fin") body = hojaFin();
    else if (sh.tipo === "ses") body = hojaSes(sh.id);
    else if (sh.tipo === "fuerza") body = hojaFuerza(sh.k);
    else if (sh.tipo === "elegir") body = `<div class="sheet-h"><h2>¿Qué entrenas?</h2>${xBtn()}</div>
        <div class="list">${ORDEN_DIAS.filter((x) => !DIA[x].descanso).map((x) => `<button class="li" data-a="empezar" data-dow="${x}"><span class="k">${DIA[x].corto}</span><div class="li-t"><b>${esc(DIA[x].titulo)}</b><span>${DIA[x].extra ? esc(DIA[x].extra) + " · " : ""}≈ ${minDia(DIA[x], semDe(semana().n))} min</span></div><span class="chev">›</span></button>`).join("")}</div>
        <div class="row" style="gap:8px"><button class="btn block" data-a="empezar-cardio">Solo cardio</button><button class="btn block" data-a="registrar">Ejercicio suelto</button></div>`;
    else if (sh.tipo === "agregar") body = `<div class="sheet-h"><h2>${sh.modo === "registrar" ? "Registrar un ejercicio" : "Agregar ejercicio"}</h2>${xBtn()}</div>
        <div class="search"><input id="qa" type="search" data-in="qa" value="${esc(S.ui.qa)}" placeholder="Busca el ejercicio" autocomplete="off" aria-label="Buscar ejercicio para agregar"></div><div id="resa"></div>`;
    else if (HOJAS[sh.tipo]) body = HOJAS[sh.tipo](sh);
    else if (sh.tipo === "cambiar") {
      const da = diaAct(), dn = ((sh.rid && rutinaPorId(sh.rid)) || RUT).dias.find((x) => x.dow === sh.dow) || DIA[sh.dow];
      body = `<div class="sheet-h"><h2>Ya tienes una sesión en curso</h2>${xBtn()}</div>
        <p class="muted">Llevas ${hechasAct()} series marcadas en ${esc(da.titulo)}. Si empiezas ${esc(dn.titulo)}, esa sesión se descarta.</p>
        <button class="btn primary block" data-a="ir" data-v="sesion">Seguir con ${esc(da.titulo)}</button>
        <button class="btn danger block" data-a="forzar" data-dow="${sh.dow}" data-rid="${esc(sh.rid || "")}">Descartar y empezar ${esc(dn.titulo)}</button>`;
    }
    const llave = sh.tipo + ":" + (sh.id || sh.k || ""), antes = el.querySelector(".sheet"), sc = antes && S.ui.hojaLlave === llave ? antes.scrollTop : 0;
    el.innerHTML = `<div class="scrim" data-a="cerrar"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${body}</div>`;
    S.ui.hojaLlave = llave;
    if (sc) el.querySelector(".sheet").scrollTop = sc;
    if (sh.tipo === "agregar") renderAgregar();
    if (HOJAS_POST[sh.tipo]) HOJAS_POST[sh.tipo](sh);
  }
  const xBtn = () => `<button class="x-btn" data-a="cerrar" aria-label="Cerrar">×</button>`;
  function hojaEj(id) {
    const e = EJ[id];
    const hist = [];
    [...S.ses].sort((a, b) => (b.inicio > a.inicio ? 1 : -1)).forEach((s) => s.entradas.forEach((x) => { if (x.ej === id) hist.push({ s, x }); }));
    const dias = RUT.dias.filter((d) => d.ej.some((sl) => sl.op.some((o) => o.ej === id))).map((d) => d.nombre);
    let h = `<div class="sheet-h"><div><p class="eyebrow">${esc(e.grupos.map((g) => GRUPO[g].nombre).join(" · "))}</p><h2>${esc(e.nombre)}</h2></div>${xBtn()}</div>
      ${animHTML(id, S.ui.varSel || "", "big") || '<p class="ph">Todavía no hay animación fiel para este ejercicio.</p>'}
      <div class="def" style="grid-template-columns:110px 1fr">${e.principal ? `<dt>Principal</dt><dd>${esc(MUSC[e.principal].nombre)}</dd>` : ""}
      ${e.secundarios.length ? `<dt>Secundarios</dt><dd>${esc(e.secundarios.map((m) => MUSC[m].nombre).join(", "))}</dd>` : ""}
      <dt>Equipo</dt><dd>${esc(e.equipo.map((q) => EQ[q]).join(", ") || "Por confirmar")}</dd>
      ${dias.length ? `<dt>En tu rutina</dt><dd>${esc(dias.join(", "))}</dd>` : ""}
      ${e.sinonimos.length ? `<dt>También como</dt><dd>${esc(e.sinonimos.join(", "))}</dd>` : ""}</div>`;
    if (e.nota) h += `<p class="small muted">${esc(e.nota)}</p>`;
    if (e.variantes.length) h += `<div class="stack-s"><p class="sec-t" style="margin:0">Variantes</p><div class="chips">${["", ...e.variantes].map((v) => `<button class="chip ${(S.ui.varSel || "") === v ? "on" : ""}" data-a="varsel" data-v="${esc(v)}">${v ? esc(v) : "Normal"}</button>`).join("")}</div></div>`;
    if (S.act) h += `<button class="btn primary block" data-a="addx" data-ej="${id}">Agregar a la sesión${S.ui.varSel ? " · " + esc(S.ui.varSel) : ""}</button>`;
    h += `<button class="btn block" data-a="abrir-fuerza" data-ej="${id}">Ver mi fuerza y registrar${S.ui.varSel ? " · " + esc(S.ui.varSel) : ""}</button>`;
    h += `<div class="stack-s"><p class="sec-t" style="margin:0">Historial</p>${hist.length ? `<div class="list">${hist.slice(0, 8).map(({ s, x }) => `<div class="li" style="align-items:flex-start"><div class="li-t"><b class="small">${fechaCorta(s.inicio)}${x.var ? " · " + esc(x.var) : ""}</b><span class="num">${esc(seriesTxt(x, true))}</span></div></div>`).join("")}</div>` : `<p class="small dim">Todavía no lo registras.</p>`}</div>`;
    return h;
  }
  function hojaFin() {
    const ses = construirSesion();
    const ef = ses.entradas.reduce((a, e) => a + e.series.filter((x) => esEfectiva(x) && !esCardio(e)).length, 0);
    const da = diaAct();
    if (S.act.fuera) {
      const c = ses.entradas.filter(esCardio), km = c.reduce((a, e) => a + e.series.reduce((b, x) => b + (+x.dist || 0), 0), 0);
      const fcs = c.flatMap((e) => e.series.map((x) => +x.fc).filter(Boolean)), fc = fcs.length ? Math.round(fcs.reduce((a, b) => a + b, 0) / fcs.length) : 0;
      return `<div class="sheet-h"><div><p class="eyebrow">${esc(da.corto)} · terminar</p><h2>${esc(da.titulo)}</h2></div>${xBtn()}</div>
      <div class="kv"><div><b>${duracion(minCardio(ses))}</b><span>de cardio</span></div><div><b>${km ? esc(fmtDist(km, S.aj.dist)) : "—"}</b><span>distancia</span></div><div><b>${fc || "—"}</b><span>FC promedio</span></div></div>
      ${ses.entradas.length ? `<p class="small muted">${esc(cardioTxt(ses.entradas) || ses.entradas.map((e) => e.nombre).join(", "))}</p>` : `<p class="small muted">Marca al menos un ejercicio para guardarlo.</p>`}
      <button class="btn primary block" data-a="guardar" ${ses.entradas.length ? "" : "disabled"}>Guardar</button>
      <button class="btn block" data-a="cerrar">Seguir</button>
      <button class="btn danger block" data-a="descartar">${S.ui.confirm === "descartar" ? "Toca otra vez para descartar" : "Descartar"}</button>`;
    }
    const plan = da.ej.reduce((a, sl, i) => a + S.act.slots[i].filas.filter((f) => f.tipo === "ef").length, 0);
    let vol = 0;
    ses.entradas.forEach((e) => e.series.forEach((s) => { if (s.peso && s.reps && s.tipo !== "cal" && s.tipo !== "rampa") vol += s.peso * s.reps; }));
    const rec = records(ses, S.ses);
    let sube = 0, igual = 0, baja = 0;
    ses.entradas.forEach((e) => {
      if (esCardio(e)) return;
      const p = historialEj(S.ses, e.ej, e.var, 1, ses.id)[0];
      if (!p) return;
      const a = mejorE1rm(e), b = mejorE1rm(p.entrada);
      const x = a && b ? a - b : e.series.reduce((t, s) => t + (s.reps || 0), 0) - p.entrada.series.reduce((t, s) => t + (s.reps || 0), 0);
      if (Math.abs(x) < 0.01) igual++; else if (x > 0) sube++; else baja++;
    });
    const contra = sube + igual + baja ? `<div class="info"><b>Contra la vez anterior</b><span>${[sube ? "Subiste en " + sube + (sube === 1 ? " ejercicio" : " ejercicios") : "", igual ? "igualaste " + igual : "", baja ? "bajaste en " + baja : ""].filter(Boolean).join(", ")}.</span></div>` : "";
    const faltan = da.ej.filter((sl, i) => !S.act.slots[i].filas.some((f) => f.hecha)).map((sl) => sl.k);
    return `<div class="sheet-h"><div><p class="eyebrow">${esc(da.corto)} · terminar</p><h2>${esc(da.titulo)}</h2></div>${xBtn()}</div>
      <div class="kv"><div><b>${duracion(ses.min)}</b><span>duración</span></div><div><b>${ef} / ${plan}</b><span>series efectivas</span></div><div><b>${fmtN(kgA(S.aj.peso === "lb" ? "lb" : "kg", vol), 0)}</b><span>volumen (${S.aj.peso === "lb" ? "lb" : "kg"} × reps)</span></div></div>
      ${rec.length ? `<div class="info up"><b>Récords de hoy</b>${rec.map((r) => `<span>${esc(r.nombre)}: 1RM est. ${esc(pesoTxt(Math.round(r.cur * 10) / 10))} (antes ${esc(pesoTxt(Math.round(r.prev * 10) / 10))})</span>`).join("")}</div>` : ""}
      ${contra}
      ${faltan.length ? `<p class="small muted">Sin series marcadas: ${esc(faltan.join(", "))}. No se guardan.</p>` : ""}
      <button class="btn primary block" data-a="guardar">Guardar sesión</button>
      <button class="btn block" data-a="cerrar">Seguir entrenando</button>
      <button class="btn danger block" data-a="descartar">${S.ui.confirm === "descartar" ? "Toca otra vez para descartar" : "Descartar sesión"}</button>`;
  }
  function hojaSes(id) {
    const s = datos().find((x) => x.id === id);
    if (!s) return `<div class="sheet-h"><h2>Sesión no encontrada</h2>${xBtn()}</div>`;
    const ef = s.entradas.reduce((a, e) => a + e.series.filter((x) => esEfectiva(x) && !esCardio(e)).length, 0);
    const soloCardio = s.entradas.length && s.entradas.every(esCardio);
    return `<div class="sheet-h"><div><p class="eyebrow">${esc(cap(fechaLarga(new Date(s.inicio))))}${s.semana && !s.fuera ? " · semana " + s.semana : ""}</p><h2>${esc(s.diaTitulo)}</h2></div>${xBtn()}</div>
      <p class="small muted">${soloCardio ? duracion(minCardio(s)) + " de cardio" : duracion(s.min || 0) + " · " + efTxt(ef) + " · pesos en " + (S.aj.peso === "lb" ? "lb" : "kg")}</p>
      ${relojHTML(s)}
      <p class="small dim" style="margin-top:-4px">Toca un ejercicio para ver cada serie y compararla con la vez anterior.</p>
      <div class="list">${s.entradas.map((e, i) => entradaSes(s, e, i)).join("")}</div>
      ${s.ejemplo ? "" : `<button class="btn danger block" data-a="borrarses" data-id="${esc(s.id)}">${S.ui.confirm === "ses:" + s.id ? "Toca otra vez para borrarla" : "Borrar esta sesión"}</button>`}`;
  }
  /* Un ejercicio de una sesión guardada: cada serie, 1RM, volumen y la vez anterior; se puede corregir */
  function entradaSes(s, e, i) {

  function generarEjemplo() {
    const out = [], hoy = new Date(), lun = lunesDe(hoy);
    const base = { barra: 60, barra_z: 30, mancuernas: 24, smith: 50, maquina: 55, maquina_discos: 90, polea: 25, disco: 10, landmine: 30 };
    for (let w = 7; w >= 0; w--) {
      for (const d of RUT.dias) {
        if (d.descanso) continue;
        const f = new Date(lun); f.setDate(lun.getDate() - w * 7 + ((d.dow + 6) % 7)); f.setHours(19, 5, 0, 0);
        if (f > hoy) continue;
        const entradas = d.ej.map((sl, si) => {
          const op = sl.op[0], e = EJ[op.ej], eq = e.equipo[0] || "maquina";
          const kg = redondear((base[eq] || 40) * (1 + ((si * 7) % 5) / 10) * (1 + 0.012 * (7 - w) + ((w * 3 + si) % 4 === 0 ? -0.01 : 0)), 2.5);
          const p = prescripcion(sl, 2, semDe(2)), ef0 = p.filas.find((x) => x.tipo === "ef");
          const r = parseRange(ef0 && ef0.reps) || { min: 8, max: 12 };
          const series = p.filas.map((x, k) => {
            const s = { tipo: x.tipo, reps: x.tipo === "ef" ? Math.max(r.min, r.max - (k % 3) - (w > 1 ? 1 : 0)) : num(x.reps) || 10 };
            if (e.registro !== "reps") s.peso = x.tipo === "cal" ? redondear(kg * 0.5, 2.5) : x.tipo === "rampa" ? redondear(kg * 0.75, 2.5) : kg;
            if (x.tipo === "ef") s.rir = 1;
            return s;
          });
          return { slot: slotId(d.dow, sl.k), k: sl.k, ej: op.ej, var: op.var || "", nombre: sl.t, series };
        });
        const mn = minDia(d, semDe(2));
        out.push({ id: "ejemplo" + w + d.dow, ejemplo: true, bloque: RUT.id, semana: 2, dia: d.dow, diaTitulo: d.titulo, inicio: f.toISOString(), fin: new Date(+f + mn * 60000).toISOString(), min: mn, entradas });
      }
    }
    return out;
  }

  function generarEjemploCuerpo() {
    const out = [], hoy = new Date();
    for (let w = 12; w >= 0; w--) {

      out.push({ id: "ejc" + w, ejemplo: true, fecha: fechaLocalISO(f), fuente: "ejemplo",

    }

  }

    if (tecs.length) h += `<p class="sec-t">Técnicas de intensidad</p><div class="card"><div class="list">${tecs.map((c) => { const [nm, como, ev] = R.tecnicas[c]; return `<div class="li" style="align-items:flex-start"><span class="tec" style="margin-top:2px">${esc(c)}</span><div class="li-t"><b>${esc(nm)}</b><span style="color:var(--fg)">${esc(como)}</span><span>${esc(ev)}</span></div></div>`; }).join("")}</div></div>`;
    h += `<p class="sec-t">Volumen semanal por músculo · series directas</p>${tablaVolumen(R)}

    return h + "</div>";
  }
  VISTA_FN.rutina = vRutina;

  function diaRutina(d, n, R, vig) {
    const ab = S.ui.diaAb === d.dow, sem = R.semanas[n - 1] || null;
    let h = `<div><button class="dia-h" data-a="dia" data-dow="${d.dow}" aria-expanded="${ab}"><span class="d">${d.corto}</span><span class="t"><b>${esc(d.titulo)}</b><span>${d.descanso ? esc(d.extra || "Recuperación") : (d.extra ? esc(d.extra) + " · " : "") + "≈ " + minDia(d, sem) + " min · " + seriesDia(d, sem) + " series"}</span></span><span class="chev">${d.descanso ? "" : ab ? "−" : "+"}</span></button>`;
    if (ab && !d.descanso) {
      h += `<div class="dia-b">${d.ej.map((sl) => {
        const p = prescripcion(sl, n, sem), nt = notaSlot(sl, sem);
        return `<div class="slot ${grupoSS(sl.k) ? "in-ss" : ""}"><span class="k">${sl.k}</span><div class="stack-s" style="gap:4px;min-width:0"><b>${esc(sl.t)}${sl.star ? ' <span class="star">★</span>' : ""}</b>
          <span class="meta">${resumen(p.filas, sl)}${sl.aprox ? " · con aprox." : ""} · RIR ${esc(rirTxt(sl, sem))} · Desc. ${esc(sl.d)}</span>

      <button class="btn primary block" data-a="empezar" data-dow="${d.dow}" ${vig ? "" : `data-rid="${esc(R.id)}"`}>Entrenar ${esc(d.nombre.toLowerCase())}${vig ? "" : " con esta rutina"}</button></div>`;
    }
    return h + "</div>";
  }

  /* ───────── Mis rutinas ───────── */
  function vMisRutinas() {
    const rs = [...S.rutinas].sort((a, b) => (a.inicio < b.inicio ? 1 : -1));
    let h = `<div class="top"><button class="back" data-a="ir" data-v="rutina" aria-label="Volver a Rutina">‹</button><div class="grow"><h1>Mis rutinas</h1></div><button class="btn sm primary" data-a="rut-nueva-h">+ Nueva</button></div><div class="stack">`;
    if (S.ed) h += `<div class="card live"><p class="eyebrow">Sin guardar</p><b>${esc(S.ed.r.nombre || "Rutina nueva")}</b><span class="small muted">Dejaste esta rutina a medias.</span><div class="row wrap-ok"><button class="btn sm primary" data-a="ir" data-v="editor">Seguir editando</button><button class="btn sm danger" data-a="ed-descartar">${S.ui.confirm === "ed" ? "Toca otra vez para descartar" : "Descartar"}</button></div></div>`;
    h += `<div class="card" style="padding:4px 16px"><div class="list">${rs.map((r) => {
      const [eTxt, eCls] = estadoTxt(r), nses = S.ses.filter((s) => s.bloque === r.id).length, dias = r.dias.filter((d) => !d.descanso).length;
      const conf = S.ui.confirm === "rut:" + r.id;
      return `<div class="li" style="align-items:flex-start;flex-wrap:wrap"><div class="li-t" style="flex:1 1 220px"><b>${esc(r.nombre)} <span class="pill ${eCls}">${esc(eTxt)}</span></b>
        <span>${esc(periodoTxt(r))} · ${r.semanasTotal} sem. · ${dias} ${dias === 1 ? "día" : "días"} por semana${nses ? " · " + nses + (nses === 1 ? " sesión" : " sesiones") : ""}</span></div>
        <div class="row wrap-ok" style="gap:6px"><button class="btn sm" data-a="rut-ver" data-id="${esc(r.id)}">Ver</button><button class="btn sm" data-a="rut-editar" data-id="${esc(r.id)}">Editar</button><button class="btn sm" data-a="rut-nueva" data-de="${esc(r.id)}">Copiar</button>${S.rutinas.length > 1 ? `<button class="btn sm danger" data-a="rut-borrar" data-id="${esc(r.id)}">${conf ? "¿Borrar?" : "Borrar"}</button>` : ""}</div></div>`;
    }).join("")}</div></div>
      <p class="small dim">Manda la rutina que está en curso según su fecha de inicio; si dos se empalman, manda la que arrancó después. Tus sesiones guardadas no cambian al editar o borrar una rutina.</p></div>`;
    return h;
  }
  VISTA_FN.rutinas = vMisRutinas;

  HOJAS["rut-nueva"] = () => `<div class="sheet-h"><h2>Nueva rutina</h2>${xBtn()}</div>
    <div class="list">${[...S.rutinas].sort((a, b) => (a.inicio < b.inicio ? 1 : -1)).map((r) => `<button class="li" data-a="rut-nueva" data-de="${esc(r.id)}"><div class="li-t"><b>Copiar ${esc(r.nombre)}</b><span>${esc(periodoTxt(r))} · cambias lo que quieras</span></div><span class="chev">›</span></button>`).join("")}
    <button class="li" data-a="rut-nueva"><div class="li-t"><b>Empezar en blanco</b><span>Eliges días, ejercicios y semanas desde cero</span></div><span class="chev">›</span></button></div>`;

  /* ───────── Crear y editar ───────── */
  // La rutina JSM que trae la app, sin editar y sin ninguna sesión: es solo de ejemplo
  function semillaSinUso() {
    const r = S.rutinas.find((x) => x.id === RUT0.id);
    return !!r && !r.editada && !S.ses.some((s) => !s.ejemplo && s.bloque === RUT0.id);
  }
  function siguienteInicio() {
    const hoy = new Date();
    const ult = [...S.rutinas].filter((r) => !(r.id === RUT0.id && semillaSinUso())).sort((a, b) => (a.inicio < b.inicio ? -1 : 1)).pop();
    let d = ult ? sumarDias(finRutina(ult), 1) : hoy;
    if (d < new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate())) d = sumarDias(hoy, 0);
    if (d.getDay() !== 1) d = sumarDias(d, (8 - d.getDay()) % 7);
    return fechaLocalISO(d);
  }
  function nombreSugerido(base, inicio, N) {
    const a = sumarDias(fechaDeISO(inicio), 6), b = sumarDias(fechaDeISO(inicio), N * 7 - 1);
    const m = (d) => cap(MESES[d.getMonth()]);
    const per = a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear() ? m(a) + " " + b.getFullYear() : m(a) + "–" + m(b) + " " + b.getFullYear();
    return (base ? String(base).replace(/\s*·.*$/, "").replace(/\s*\(copia\)$/, "") : "Rutina") + " · " + per;
  }
  function prepararEd(r) {
    r.dias.forEach((d) => { const j = juntas(d); d.ej.forEach((sl, i) => { sl._ss = j[i]; }); });
    return r;
  }
  function nuevaRutina(base) {
    const inicio = siguienteInicio();
    let r;
    if (base) {
      r = clon(base);
      ["periodo", "descarga", "siguiente", "tipo"].forEach((k) => delete r[k]);
      // Copia de la rutina de ejemplo sin usar: es la primera rutina propia, no "otra JSM"
      r.nombre = nombreSugerido(base.id === RUT0.id && semillaSinUso() ? "Mi rutina" : base.nombre, inicio, base.semanasTotal);
    } else {
      r = { nombre: nombreSugerido("Rutina", inicio, 8), objetivo: "", prioridad: "", semanasTotal: 8, semanas: semanasPreset("bloque", 8), reglas: clon(RUT0.reglas), tecnicas: clon(TEC_LIB),
        dias: DOWS.map(([dow]) => (dow === 0 ? { dow, titulo: "Descanso total", descanso: true, ej: [] } : { dow, titulo: "", extra: "", ej: [], porque: [] })) };
    }
    Object.assign(r, { id: "r" + Date.now().toString(36), inicio, creada: new Date().toISOString(), editada: null, origen: "usuario" });
    normalizarRutina(r);
    S.ed = { r: prepararEd(r), id: null, dia: 1, ab: -1, tab: "datos", preset: base ? null : "bloque", err: null };
    saveEdYa(); S.sheet = null; go("editor");
  }
  function editarRutina(id) {
    const base = rutinaPorId(id);
    if (!base) return;
    if (S.ed && S.ed.id === id) { go("editor"); return; }
    S.ed = { r: prepararEd(normalizarRutina(clon(base))), id, dia: 1, ab: -1, tab: "datos", preset: null, err: null };
    saveEdYa(); go("editor");
  }
  function guardarEd() {
    S.sheet = null; S.ui.confirm = null;
    const ed = S.ed, r = clon(ed.r);
    r.nombre = String(r.nombre || "").trim();
    r.dias.forEach((d) => {
      if (d.descanso) d.ej = [];
      d.ej.forEach((sl) => { sl.s = sl.s.filter((g) => g.n >= 1); delete sl._ss; delete sl._tAuto; });
      d.series = seriesDia(d, null);
    });
    const err = validarRutina(r, EJ);
    if (err.length) { ed.err = err; saveEdYa(); render(); window.scrollTo(0, 0); toast(err[0]); return; }
    r.editada = new Date().toISOString();
    r.tipo = (r.semanas.some((w) => w.descarga) ? "Bloque de " : "Rutina de ") + r.semanasTotal + (r.semanasTotal === 1 ? " semana" : " semanas");
    const i = S.rutinas.findIndex((x) => x.id === r.id);
    if (i >= 0) S.rutinas[i] = r; else S.rutinas.push(r);
    // Guardaste tu primera rutina propia: la de ejemplo se quita para que no tome su lugar en sus fechas
    const sinEjemplo = r.id !== RUT0.id && semillaSinUso();
    if (sinEjemplo) S.rutinas = S.rutinas.filter((x) => x.id !== RUT0.id);
    S.rutinasSemilla = false;
    saveRut(); subirR(r);
    S.ed = null; saveEdYa();
    aplicarRutina();
    const e = estadoRutina(r, new Date());
    toast((r.id === RUT.id ? (e === "antes" ? "Guardada. Arranca el " + fechaLarga(fechaDeISO(r.inicio)) : "Guardada. Ya es tu rutina actual") : "Guardada. Arranca el " + fechaLarga(fechaDeISO(r.inicio))) + (sinEjemplo ? ". Quité la de ejemplo" : ""));
    S.ui.verRut = r.id === RUT.id ? null : r.id; S.ui.semRut = null; S.ui.diaAb = null;
    go("rutina");
  }

  /* ───────── Editor ───────── */
  const ED = () => S.ed && S.ed.r;
  const edDia = () => ED().dias.find((d) => d.dow === S.ed.dia);
  function autoTitulo(sl) { return sl.op.map((o) => nombreEj(o.ej, o.var)).join(" o "); }
  function resumenSlot(sl) {
    const p = prescripcion(sl, null, null);
    return resumen(p.filas, sl) + (sl.s.some((g) => g.tipo === "ef") ? " · RIR " + rirTxt(sl, null) : "") + " · " + (sl.d === "—" ? "sin descanso" : sl.d) + (sl.tempo ? " · tempo " + sl.tempo : "") + ((sl.tec || []).filter((c) => c !== "SS").length ? " · " + sl.tec.filter((c) => c !== "SS").join(" ") : "");
  }
  function cambio() { S.ed.err = null; saveEd(); }
  function reNum(d) {
    if (d.ej.length) d.ej[d.ej.length - 1]._ss = false;
    rekey(d, d.ej.map((s) => !!s._ss));
    // "[SS] con A1" en la nota sigue a la clave nueva del compañero
    d.ej.forEach((sl, i) => {
      const prev = d.ej[i - 1];
      if (prev && prev._ss && /\[SS\]\s*con\s+[A-Z]\d/.test(sl.nota || "")) sl.nota = sl.nota.replace(/(\[SS\]\s*con\s+)[A-Z]\d/, "$1" + prev.k);
    });
  }

  function vEditor() {
    const ed = S.ed;
    if (!ed) { S.view = "rutinas"; return vMisRutinas(); }
    const r = ed.r;
    const tabs = [["datos", "Datos"], ["semanas", "Semanas"], ["dias", "Días"], ["resumen", "Resumen"]];
    let h = `<div class="top line"><button class="back" data-a="ed-salir" aria-label="Salir del editor">‹</button><div class="grow"><p class="eyebrow">${ed.id ? "Editar rutina" : "Nueva rutina"}</p><h1>${esc(r.nombre || "Sin nombre")}</h1></div><button class="btn primary sm" data-a="ed-guardar">Guardar</button></div><div class="stack" style="margin-top:12px">`;
    h += `<div class="seg">${tabs.map(([v, l]) => `<button class="${ed.tab === v ? "on" : ""}" data-a="ed-tab" data-v="${v}">${l}</button>`).join("")}</div>`;
    if (ed.err && ed.err.length) h += `<div class="info" style="border:1px solid var(--bad)"><b style="color:var(--bad)">Falta para guardar</b>${ed.err.slice(0, 6).map((e) => `<span>${esc(e)}</span>`).join("")}</div>`;
    if (ed.id && ed.id === RUT.id && estadoRutina(r, new Date()) === "en") h += `<p class="small muted">Esta es tu rutina en curso: los cambios aplican desde tu próxima sesión. Lo que ya registraste no cambia.</p>`;
    h += ed.tab === "semanas" ? edSemanas(r) : ed.tab === "dias" ? edDias(r) : ed.tab === "resumen" ? edResumen(r) : edDatos(r);
    h += `<button class="btn primary block" data-a="ed-guardar">Guardar rutina</button>`;
    h += `<datalist id="dl-reps">${["5–8", "6–8", "6–10", "8–10", "8–12", "10–12", "10–15", "12–15", "15–20", "20", "Fallo"].map((x) => `<option value="${x}">`).join("")}</datalist>
      <datalist id="dl-rir">${["3", "2", "1–2", "1", "0–1", "0", "2 → 1", "1 → 0"].map((x) => `<option value="${x}">`).join("")}</datalist>`;
    return h + "</div>";
  }
  VISTA_FN.editor = vEditor;

  function edDatos(r) {
    const ini = fechaDeISO(r.inicio), fin = finRutina(r), valida = !isNaN(ini);
    const otras = S.rutinas.filter((x) => x.id !== r.id && valida && fechaDeISO(x.inicio) <= fin && finRutina(x) >= ini);
    const N = r.semanasTotal;
    return `<div class="card set-g"><div class="form-g" style="grid-template-columns:1fr">
      <label>Nombre<input class="in" data-ed="nombre" value="${esc(r.nombre)}" placeholder="Rutina JSM · Ene–Feb 2027" autocomplete="off"></label></div>
      <div class="form-g"><label>Objetivo<input class="in" data-ed="objetivo" value="${esc(r.objetivo || "")}" placeholder="Classic Physique" autocomplete="off"></label>
      <label>Prioridad<input class="in" data-ed="prioridad" value="${esc(r.prioridad || "")}" placeholder="Bíceps · hombro" autocomplete="off"></label></div></div>
      <div class="card set-g"><h3>Cuándo y cuánto dura</h3>
      <div class="form-g"><label>Empieza<input class="in" type="date" data-ed="inicio" value="${esc(r.inicio)}"></label>
      <label>Semanas<input class="in" data-ed="semanasTotal" inputmode="numeric" value="${N}" autocomplete="off"></label></div>
      <div class="chips">${[4, 5, 6, 8, 10, 12].map((x) => `<button class="chip ${N === x ? "on" : ""}" data-a="ed-semanas" data-n="${x}">${x} semanas</button>`).join("")}</div>
      ${valida ? `<p class="small" id="ed-rango">Del <b>${esc(fechaLarga(ini))}</b> al <b>${esc(fechaLarga(fin))}</b> de ${fin.getFullYear()}.</p>` : ""}
      ${valida && ini.getDay() !== 1 ? `<p class="small muted">No empieza en lunes: cada semana del bloque irá de ${esc(DIAS_L[ini.getDay()])} a ${esc(DIAS_L[(ini.getDay() + 6) % 7])}.</p>` : ""}
      ${otras.map((x) => `<p class="small muted">Se empalma con ${esc(x.nombre)} (${esc(periodoTxt(x))}). ${x.inicio < r.inicio ? "Desde el " + esc(fechaCorta(r.inicio + "T12:00:00")) + " manda esta." : "Cuando arranque " + esc(x.nombre) + ", mandará esa."}</p>`).join("")}
      <p class="small dim">Cambiar la duración rehace las semanas con la plantilla que elijas en Semanas.</p></div>`;
  }

  function edSemanas(r) {
    const tg = (w, f, l) => `<button class="chip ${w[f] ? "on" : ""}" data-a="ed-semtog" data-n="${w.n}" data-f="${f}">${l}</button>`;
    return `<div class="card set-g"><h3>Plantilla</h3><div class="chips">${PRESETS.map(([v, l]) => `<button class="chip ${S.ed.preset === v ? "on" : ""}" data-a="ed-preset" data-v="${v}">${l}</button>`).join("")}</div>
      <p class="small dim">${S.ed.preset === "simple" ? "Progresas carga o reps cada semana y la última es descarga." : S.ed.preset === "igual" ? "Todas las semanas como está escrita la rutina, sin descarga." : "Semana 1 de calibración a RIR 2, +1 serie a los ★ en la segunda mitad, semana pico y descarga al final (como tu Rutina JSM)."}</p></div>
      ${r.semanas.map((w) => `<div class="card set-g sub"><div class="row between"><b>Semana ${w.n}</b><span class="small muted">${esc(fechasSemana(r, w.n))}</span></div>
        <input class="in" data-ed="sem" data-n="${w.n}" data-f="que" value="${esc(w.que || "")}" placeholder="Qué toca esta semana" autocomplete="off">
        <div class="chips">${tg(w, "tec", "Técnicas")}${tg(w, "star", "★ +1 serie")}${tg(w, "descarga", "Descarga")}${tg(w, "aviso", "Destacar")}</div>
        <div class="form-g"><label>RIR de la semana<input class="in" data-ed="sem" data-n="${w.n}" data-f="rir" value="${esc(w.rir === "Tabla" ? "" : w.rir || "")}" placeholder="El de cada ejercicio" list="dl-rir" autocomplete="off"></label>
        <label>¿En todas las series?<button class="chip ${w.rirFijo ? "on" : ""}" style="height:44px;justify-content:center" data-a="ed-semtog" data-n="${w.n}" data-f="rirFijo">${w.rirFijo ? "Sí, fijo" : "No, el de la tabla"}</button></label></div></div>`).join("")}`;
  }

  function edDias(r) {
    const ed = S.ed, d = edDia(), sem = null;
    let h = `<div class="chips">${DOWS.map(([dow, , corto]) => { const x = r.dias.find((y) => y.dow === dow); return `<button class="chip ${ed.dia === dow ? "on" : ""}" data-a="ed-dia" data-dow="${dow}" style="${x.descanso ? "opacity:.6" : ""}">${corto}${x.descanso ? "" : " · " + x.ej.length}</button>`; }).join("")}</div>`;
    h += `<div class="card set-g"><div class="set-r"><h3>${esc(d.nombre)}</h3><div class="row"><span class="small muted">Descanso</span><button class="tog ${d.descanso ? "on" : ""}" data-a="ed-descanso" role="switch" aria-checked="${!!d.descanso}" aria-label="Día de descanso"></button></div></div>`;
    if (d.descanso) {
      h += `<div class="form-g" style="grid-template-columns:1fr"><label>Nombre del día<input class="in" data-ed="dia" data-f="titulo" value="${esc(d.titulo || "")}" placeholder="Descanso total" autocomplete="off"></label></div></div>`;
      return h;
    }
    const est = estimarMin(d, sem);
    h += `<div class="form-g"><label>Título<input class="in" data-ed="dia" data-f="titulo" value="${esc(d.titulo || "")}" placeholder="Pecho + Bíceps" autocomplete="off"></label>
      <label>Subtítulo<input class="in" data-ed="dia" data-f="extra" value="${esc(d.extra || "")}" placeholder="+ deltoide lateral" autocomplete="off"></label>
      <label>Duración (min)<input class="in" data-ed="dia" data-f="min" inputmode="numeric" value="${d.min ? esc(d.min) : ""}" placeholder="≈ ${est}" autocomplete="off"></label>
      <label>Copiar de<select class="in" data-ed="copiar"><option value="">Otro día…</option>${r.dias.filter((x) => x.dow !== d.dow && !x.descanso && x.ej.length).map((x) => `<option value="${x.dow}">${esc(x.nombre)} · ${esc(x.titulo)}</option>`).join("")}</select></label></div>
      <p class="small muted">≈ ${d.min || est} min · ${efTxt(seriesDia(d, null))} · ${d.ej.length} ${d.ej.length === 1 ? "ejercicio" : "ejercicios"}</p></div>`;

      <div class="card set-g"><label class="small muted" style="display:grid;gap:4px">Notas del día (por qué así, recordatorios)<textarea class="ta" data-ed="dia" data-f="notas" placeholder="Inclinado primero porque…">${esc(d.notas || "")}</textarea></label></div>`;
    return h;
  }

  function slotEd(d, sl, i) {

    let bandas = "";
