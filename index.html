      }
    }
    if (!ws.length) return h + `<div class="card"><p class="muted">Todavía no hay entrenamientos del reloj. Cuando registres uno en tu Galaxy Watch (pesas, correr, nadar…) y Samsung Health lo pase a Health Connect, aparece aquí.</p></div>`;
    const hay = new Set(ws.map((w) => infoEntreno(w.tipo).grupo));
    const f = hay.has(S.ui.rFil) ? S.ui.rFil : "todo";
    h += `<div class="chips">${[["todo", "Todo"], ...GRUPOS_W.filter(([g]) => hay.has(g))].map(([v, l]) => `<button class="chip ${f === v ? "on" : ""}" data-a="reloj-fil" data-v="${v}">${l}</button>`).join("")}</div>`;
    if (f === "todo" || f === "correr") h += secCorrer();
    if (f === "todo" || f === "nadar") h += secNadar();
    if ((f === "todo" || f === "correr") && S.relojx.vo2.length) {
      const v = S.relojx.vo2, ult = v[v.length - 1], pri = v.find((p) => Date.parse(p.t) >= Date.now() - 180 * 864e5) || v[0];
      h += `<div class="card"><div class="row between"><h3>VO₂ máx.</h3><span class="small muted">${fechaCorta(ult.t)}</span></div>${grande(ult.y, "ml/kg/min", v.length > 1 ? ult.y - pri.y : null, false, v.length > 1 ? "en 6 meses" : "", 1)}
        ${chartSVG(v.slice(-80), { alto: 150, puntos: v.length < 30, titulo: "VO₂ máx." })}<p class="small dim">Lo estima tu Galaxy Watch al correr. Sube cuando mejora tu condición aeróbica.</p></div>`;
    }
    const lista = ws.filter((w) => f === "todo" || infoEntreno(w.tipo).grupo === f);
    const n = S.ui.rMas ? lista.length : Math.min(lista.length, 30);
    h += `<p class="sec-t">Entrenamientos</p><div class="card" style="padding:4px 16px"><div class="list">${lista.slice(0, n).map(filaEntreno).join("")}</div></div>`;
    if (lista.length > n) h += `<button class="btn block" data-a="reloj-mas">Ver los ${lista.length}</button>`;
    return h;
  }
  function filaEntreno(w) {
    const inf = infoEntreno(w.tipo), ses = w.ses && S.ses.find((s) => s.id === w.ses);
    const p = [durW(w.seg)];
    if (w.dist) p.push(distTxt(w.dist));
    if (w.dist && (inf.grupo === "correr" || inf.grupo === "caminar")) p.push(fmtRitmo(ritmoKm(w.seg, w.dist), S.aj.dist));
    if (w.dist && inf.grupo === "nadar") p.push(ritmo100(w));
    if (w.kcal) p.push(w.kcal + " kcal");
    if (w.fc && w.fc.fcProm) p.push("FC " + w.fc.fcProm);
    return `<button class="li" data-a="ver-entreno" data-id="${esc(w.id)}"><span class="ico-w">${svg(ICON_W[inf.grupo] || ICON_W.otro, 20)}</span><div class="li-t"><b>${esc(inf.nombre)}${ses ? ` <span class="pill acc">${esc(ses.diaTitulo)}</span>` : ""}</b><span class="num">${esc(cap(DIAS_L[new Date(w.inicio).getDay()]).slice(0, 3))} ${fechaCorta(w.inicio)} · ${hora(w.inicio)} · ${esc(p.join(" · "))}</span></div><span class="chev">›</span></button>`;
  }
  function secCorrer() {
    const rc = resumenCorrer(S.reloj, new Date(), 12);
    if (!rc.runs.length) return "";
    const u = S.aj.dist, esta = rc.sem[rc.sem.length - 1], pasada = rc.sem[rc.sem.length - 2];
    const lim28 = Date.now() - 28 * 864e5, r28 = rc.runs.filter((w) => Date.parse(w.inicio) >= lim28);
    const rit28 = r28.length ? ritmoKm(r28.reduce((a, w) => a + w.seg, 0), r28.reduce((a, w) => a + w.dist, 0)) : null;
    const mes = new Date(); mes.setDate(1); mes.setHours(0, 0, 0, 0);
    const kmMes = rc.runs.filter((w) => new Date(w.inicio) >= mes).reduce((a, w) => a + w.dist / 1000, 0);
    const conv = u === "mi" ? 1.609344 : 1;
    const pts = rc.runs.filter((w) => w.dist >= 2000).slice(-40).map((w) => ({ t: w.inicio, y: ritmoKm(w.seg, w.dist) * conv }));
    const rec = [
      rc.largo && ["Carrera más larga", distTxt(rc.largo.dist) + " · " + durW(rc.largo.seg), rc.largo],
      rc.rapido && ["Mejor ritmo (3 km o más)", fmtRitmo(ritmoKm(rc.rapido.seg, rc.rapido.dist), u) + " · " + distTxt(rc.rapido.dist), rc.rapido],
      rc.r5 && ["5 km a tu mejor ritmo", "≈ " + fmtDur(ritmoKm(rc.r5.seg, rc.r5.dist) * 5), rc.r5],
      rc.r10 && ["10 km a tu mejor ritmo", "≈ " + fmtDur(ritmoKm(rc.r10.seg, rc.r10.dist) * 10), rc.r10],
      rc.semMax && ["Semana con más distancia", fmtN(kmU(rc.semMax.km), 1) + " " + uD() + " · semana del " + fechaCorta(rc.semMax.t), null],
    ].filter(Boolean);
    return `<div class="card"><div class="row between"><h3>Correr</h3><span class="small muted">${rc.runs.length} ${rc.runs.length === 1 ? "carrera" : "carreras"}</span></div>
      <div class="stats"><div><b class="num">${fmtN(kmU(esta.km), 1)}</b><span>${uD()} esta semana${pasada.km ? " · " + fmtN(kmU(pasada.km), 1) + " la pasada" : ""}</span></div><div><b class="num">${fmtN(kmU(kmMes), 1)}</b><span>${uD()} este mes</span></div><div><b class="num">${rit28 ? fmtRitmo(rit28, u).split(" ")[0] : "—"}</b><span>ritmo prom. 4 semanas (/${uD()})</span></div></div>
      <p class="sec-t" style="margin:4px 0 0">Distancia por semana (${uD()})</p>${barrasSVG(rc.sem)}
      ${pts.length > 1 ? `<p class="sec-t" style="margin:4px 0 0">Ritmo por carrera · más abajo es más rápido</p>${chartSVG(pts, { alto: 160, puntos: true, fmt: (v) => reloj(v), titulo: "Ritmo por carrera" })}` : ""}
      <div class="list">${rec.map(([t, v, w]) => `<${w ? `button class="li" data-a="ver-entreno" data-id="${esc(w.id)}"` : 'div class="li"'}><div class="li-t"><b class="small">${esc(t)}</b><span class="num">${esc(v)}${w ? " · " + fechaCorta(w.inicio) : ""}</span></div>${w ? '<span class="chev">›</span></button>' : "</div>"}`).join("")}</div></div>`;
  }
  function secNadar() {
    const sw = S.reloj.filter((w) => infoEntreno(w.tipo).grupo === "nadar" && w.seg > 60);
    if (!sw.length) return "";
    const conD = sw.filter((w) => w.dist > 0);
    const tot = conD.reduce((a, w) => a + w.dist, 0), seg = conD.reduce((a, w) => a + w.seg, 0);
    const mejor = conD.reduce((b, w) => (!b || w.seg / w.dist < b.seg / b.dist ? w : b), null);
    return `<div class="card"><div class="row between"><h3>Nadar</h3><span class="small muted">${sw.length} ${sw.length === 1 ? "sesión" : "sesiones"}</span></div>
      <div class="stats"><div><b class="num">${tot ? fmtN(tot / 1000, 2) : "—"}</b><span>km en total</span></div><div><b class="num">${tot ? reloj(seg / (tot / 100)) : "—"}</b><span>ritmo prom. /100 m</span></div><div><b class="num">${mejor ? reloj(mejor.seg / (mejor.dist / 100)) : "—"}</b><span>mejor ritmo /100 m</span></div></div></div>`;
  }

  /* Detalle de un entrenamiento del reloj */
  HOJAS.entreno = (sh) => {
    const w = S.reloj.find((x) => x.id === sh.id);
    if (!w) return `<div class="sheet-h"><h2>No encontré ese entrenamiento</h2>${xBtn()}</div>`;
    const inf = infoEntreno(w.tipo), ses = w.ses && S.ses.find((s) => s.id === w.ses), fm = fcMaxAj();
    const kv = [[durExacta(w.seg), "duración"]];
    if (w.dist) kv.push([distTxt(w.dist), "distancia"]);
    if (w.dist && (inf.grupo === "correr" || inf.grupo === "caminar")) kv.push([fmtRitmo(ritmoKm(w.seg, w.dist), S.aj.dist), "ritmo"]);
    if (w.dist && inf.grupo === "nadar") kv.push([ritmo100(w), "ritmo"]);
    if (w.kcal) kv.push([w.kcal, "kcal"]);
    if (w.fc && w.fc.fcProm) { kv.push([w.fc.fcProm, "FC promedio"]); kv.push([w.fc.fcMax, "FC máxima"]); }
    let h = `<div class="sheet-h"><div><p class="eyebrow">${esc(cap(fechaLarga(new Date(w.inicio))))} · ${hora(w.inicio)}–${hora(w.fin)}</p><h2>${esc(inf.nombre)}</h2></div>${xBtn()}</div>
      <div class="stats">${kv.map(([b, s]) => `<div><b class="num">${esc(String(b))}</b><span>${esc(s)}</span></div>`).join("")}</div>`;
    if (w.fc && w.fc.serie && w.fc.serie.length > 1) h += `<p class="sec-t" style="margin:0">Frecuencia cardiaca</p>${fcSVG(w.fc.serie, fm)}${zonasHTML(w.fc.serie, fm)}<p class="small dim">Zonas con tu FC máxima de ${fm} lpm${S.aj.fcMax ? "" : " (estimada; ajústala en Ajustes)"}.</p>`;
    else if (NAT && S.aj.salud) h += `<button class="btn" data-a="reloj-leerfc" data-id="${esc(w.id)}">Leer frecuencia cardiaca</button>`;
    if (ses) h += `<div class="info up"><b>Es tu sesión de ${esc(ses.diaTitulo)}</b><span>${w.ses && ses.reloj && ses.reloj.vinculo === "manual" ? "La vinculaste tú." : "Se vinculó sola por la hora."}</span></div>
      <div class="row wrap-ok"><button class="btn sm" data-a="verses" data-id="${esc(ses.id)}">Ver la sesión</button><button class="btn sm ghost" data-a="reloj-desvincular" data-ses="${esc(ses.id)}">Desvincular</button></div>`;
    else {
      const dia = fechaLocalISO(new Date(w.inicio));
      const cand = S.ses.filter((s) => !s.libre && fechaLocalISO(new Date(s.inicio)) === dia);
      if (cand.length) h += `<p class="sec-t" style="margin:0">¿Es una de tus sesiones?</p><div class="list">${cand.map((s) => `<button class="li" data-a="reloj-vincular" data-ses="${esc(s.id)}" data-ent="${esc(w.id)}"><div class="li-t"><b>${esc(s.diaTitulo)}</b><span>${hora(s.inicio)}–${hora(s.fin)} · ${duracion(s.min || 0)}${s.reloj && s.reloj.entreno ? " · ya tiene otro del reloj" : ""}</span></div><span class="lnk">Vincular</span></button>`).join("")}</div>`;
    }
    if (w.fuente) h += `<p class="small dim">Registrado por ${esc(fuenteTxt(w.fuente))}.</p>`;
    return h;
  };

  /* Datos del reloj dentro de la hoja de una sesión */
  function relojHTML(s) {
    if (!NAT && !s.reloj) return "";
    const r = s.reloj, fm = fcMaxAj();
    let h = `<div class="stack-s"><p class="sec-t" style="margin:0">Del reloj</p>`;
    if (r && r.entreno) h += `<button class="info up" data-a="ver-entreno" data-id="${esc(r.entreno.id)}" style="text-align:left;border:0"><b>${esc(infoEntreno(r.entreno.tipo).nombre)} en el reloj · ${hora(r.entreno.inicio)}–${hora(r.entreno.fin)}</b><span>${r.entreno.min} min${r.entreno.kcal != null ? " · " + r.entreno.kcal + " kcal" : ""} · ${r.vinculo === "manual" ? "lo vinculaste tú" : "se vinculó solo por la hora"} ›</span></button>`;
    if (r && r.muestras) {
      const z = r.z2 || [S.aj.z2lo, S.aj.z2hi];
      h += `<div class="kv"><div><b>${r.fcProm}</b><span>FC promedio (lpm)</span></div><div><b>${r.fcMax}</b><span>FC máxima</span></div><div><b>${r.z2min} min</b><span>Zona 2 (${z[0]}–${z[1]})</span></div></div>`;
      if (r.serie && r.serie.length > 1) h += fcSVG(r.serie, fm);
      h += `<p class="small muted">${r.kcal != null ? r.kcal + " kcal · " : ""}${r.muestras} lecturas${r.fuente ? " · " + esc(fuenteTxt(r.fuente)) : ""}</p>`;
    } else if (r && r.leido) h += `<p class="small muted">Cuando revisé (${fechaCorta(r.leido)} ${hora(r.leido)}), Health Connect no tenía frecuencia cardiaca de esa hora.</p>`;
    if (NAT && S.aj.salud && !s.ejemplo) {
      h += `<div class="row wrap-ok"><button class="btn sm" data-a="leer-reloj" data-id="${esc(s.id)}">${r ? "Volver a leer del reloj" : "Leer datos del reloj"}</button>${r && r.entreno ? `<button class="btn sm ghost" data-a="reloj-desvincular" data-ses="${esc(s.id)}">Desvincular</button>` : ""}</div>`;
      if (!(r && r.entreno)) {
        const dia = fechaLocalISO(new Date(s.inicio));
        const cand = S.reloj.filter((w) => !w.ses && fechaLocalISO(new Date(w.inicio)) === dia);
        if (cand.length) h += `<p class="small muted">Entrenamientos del reloj de ese día:</p><div class="list">${cand.map((w) => `<button class="li" data-a="reloj-vincular" data-ses="${esc(s.id)}" data-ent="${esc(w.id)}"><div class="li-t"><b class="small">${esc(infoEntreno(w.tipo).nombre)} · ${hora(w.inicio)}–${hora(w.fin)}</b><span>${durW(w.seg)}${w.kcal ? " · " + w.kcal + " kcal" : ""}</span></div><span class="lnk">Vincular</span></button>`).join("")}</div>`;
      }
    } else if (NAT && !s.ejemplo) h += `<p class="small dim">Conecta Health Connect en Ajustes para ver aquí tu frecuencia cardiaca.</p>`;
    return h + "</div>";
  }

  /* Tarjeta en Hoy: último cardio del reloj y recuperación */
  function cardRelojHoy() {
    const lim = Date.now() - 14 * 864e5;
    const cardio = S.reloj.filter((w) => Date.parse(w.inicio) >= lim && infoEntreno(w.tipo).grupo !== "fuerza").sort((a, b) => (a.inicio < b.inicio ? 1 : -1));
    const sue = S.relojx.sueno, rep = S.relojx.reposo;
    const anoche = sue.length && diasEntre(fechaDeISO(sue[sue.length - 1].fecha), new Date()) <= 1 ? sue[sue.length - 1] : null;
    const rep7 = rep.filter((p) => Date.parse(p.t) >= Date.now() - 7 * 864e5), rep30 = rep.filter((p) => Date.parse(p.t) >= Date.now() - 30 * 864e5);
    const prom = (a) => (a.length ? Math.round(a.reduce((x, p) => x + p.y, 0) / a.length) : null);
    if (!cardio.length && !anoche && !rep7.length) return "";
    let h = `<div class="card" data-a="ir-reloj" role="button" tabindex="0"><div class="row between"><h3>Del reloj</h3><span class="lnk">Ver ›</span></div>`;
    if (cardio.length) {
      const w = cardio[0], inf = infoEntreno(w.tipo), dd = diasEntre(new Date(w.inicio), new Date());
      const rc = resumenCorrer(S.reloj, new Date(), 1);
      h += `<div class="row" style="gap:12px"><span class="ico-w">${svg(ICON_W[inf.grupo] || ICON_W.otro, 20)}</span><div class="grow" style="display:grid;gap:1px"><b>${esc(inf.nombre)} · ${dd <= 0 ? "hoy" : dd === 1 ? "ayer" : "hace " + dd + " días"}</b><span class="small muted">${esc([durW(w.seg), w.dist ? distTxt(w.dist) : null, w.dist && inf.grupo === "correr" ? fmtRitmo(ritmoKm(w.seg, w.dist), S.aj.dist) : null, w.fc && w.fc.fcProm ? "FC " + w.fc.fcProm : null].filter(Boolean).join(" · "))}</span></div></div>`;
      if (rc.sem[0].km) h += `<p class="small muted">Esta semana: ${fmtN(kmU(rc.sem[0].km), 1)} ${uD()} corriendo en ${rc.sem[0].n} ${rc.sem[0].n === 1 ? "carrera" : "carreras"}.</p>`;
    }
    const rec = [];
    if (anoche) rec.push(`Dormiste ${Math.floor(anoche.min / 60)} h ${String(anoche.min % 60).padStart(2, "0")} min`);
    if (rep7.length) rec.push(`FC en reposo ${prom(rep7)} lpm${rep30.length > rep7.length ? " (promedio de 30 días: " + prom(rep30) + ")" : ""}`);
    if (rec.length) h += `<p class="small muted">${esc(rec.join(" · "))}</p>`;
    return h + "</div>";
  }

  /* ───────── Historial: calendario, semana y sesiones ───────── */
  function vHistorial() {
    return calendario() + vSemana() + `<p class="sec-t">Sesiones</p>` + vSesionesL();
  }
  function calendario() {
    const hoy = new Date(), [y, mo] = S.ui.calMes || [hoy.getFullYear(), hoy.getMonth()];
    const pri = new Date(y, mo, 1), nd = new Date(y, mo + 1, 0).getDate(), off = (pri.getDay() + 6) % 7;
    const dias = {};
    const add = (iso, k, item) => { const f = fechaLocalISO(new Date(iso)); (dias[f] = dias[f] || { g: 0, c: 0, l: 0, items: [] })[k]++; dias[f].items.push(item); };
    datos().forEach((s) => add(s.inicio, s.libre ? "l" : s.fuera ? "c" : "g", { ses: s }));
    S.reloj.forEach((w) => { if (!w.ses) add(w.inicio, infoEntreno(w.tipo).grupo === "fuerza" ? "g" : "c", { w }); });
    let celdas = "";
    for (let i = 0; i < off; i++) celdas += "<span></span>";
    const pf = primerasFechas();
    for (let d = 1; d <= nd; d++) {
      const fd = new Date(y, mo, d), f = fechaLocalISO(fd), x = dias[f], esHoy = f === fechaLocalISO(hoy);
      const e = S.ui.ejemplo ? null : estadoDia(fd, hoy, pf);
      const pts = (x && x.g ? '<b class="g"></b>' : e && e.falto ? '<b class="f"></b>' : "") + (x && (x.c || x.l) ? '<b class="c"></b>' : "") + (!(x && (x.g || x.c || x.l)) && e && e.marcaDesc ? '<b class="d"></b>' : "");
      celdas += `<button class="cd ${esHoy ? "hoy" : ""} ${S.ui.calDia === f ? "sel" : ""}" data-a="cal-dia" data-f="${f}"><span>${d}</span><i>${pts}</i></button>`;
    }
    const delMes = Object.entries(dias).filter(([f]) => f.startsWith(y + "-" + String(mo + 1).padStart(2, "0")));
    const nG = delMes.reduce((a, [, x]) => a + x.g, 0), nC = delMes.reduce((a, [, x]) => a + x.c, 0);
    const km = delMes.reduce((a, [, x]) => a + x.items.reduce((b, it) => b + (it.w && infoEntreno(it.w.tipo).grupo === "correr" && it.w.dist ? it.w.dist / 1000 : 0), 0), 0);
    let h = `<div class="card"><div class="row between"><button class="lnk" data-a="cal-mes" data-d="-1" aria-label="Mes anterior">‹</button><h3>${esc(cap(MESES_L[mo]))} ${y}</h3><button class="lnk" data-a="cal-mes" data-d="1" aria-label="Mes siguiente">›</button></div>
      <div class="cal">${["L", "M", "M", "J", "V", "S", "D"].map((d) => `<em>${d}</em>`).join("")}${celdas}</div>
      <p class="leyenda"><i class="lg g"></i>entrenaste ${nG} <i class="lg f"></i>faltaste <i class="lg d"></i>descanso <i class="lg c"></i>cardio ${nC}${km ? " (" + fmtN(kmU(km), 1) + " " + uD() + " corriendo)" : ""}</p>`;
    const sel = S.ui.calDia && dias[S.ui.calDia];
    if (sel) h += `<div class="list">${sel.items.map((it) => (it.ses ? filaSesion(it.ses) : filaEntreno(it.w))).join("")}</div>`;
    return h + "</div>";
  }

  /* ───────── Acciones ───────── */
  ENTRADAS.fcMax = (el) => { const v = num(el.value); if (v == null) { S.aj.fcMax = null; saveAj(); } else if (v > 120 && v < 230) { S.aj.fcMax = Math.round(v); saveAj(); } };
  Object.assign(A, {
    "reloj-sync"() { sincronizarReloj(false, true); },
    "reloj-fil"(el) { S.ui.rFil = el.dataset.v; S.ui.rMas = false; render(); },
    "reloj-mas"() { S.ui.rMas = true; render(); },
    "ir-reloj"() { S.ui.pTab = "reloj"; go("progreso"); if (NAT && S.aj.salud) sincronizarReloj(true); },
    "ver-entreno"(el) { S.sheet = { tipo: "entreno", id: el.dataset.id }; renderSheet(); },
    async "reloj-leerfc"(el) {
      const w = S.reloj.find((x) => x.id === el.dataset.id);
      if (!w || !NAT) return;
      toast("Leyendo Health Connect…");
      const fc = await leerFC(w.inicio, w.fin);
      w.fcLeido = new Date().toISOString();
      if (fc && fc.muestras) { w.fc = fc; toast("Frecuencia cardiaca lista"); } else toast("Health Connect no tiene frecuencia cardiaca de esa hora");
      saveReloj(); renderSheet(); renderSafe();
    },
    async "reloj-vincular"(el) {
      const s = S.ses.find((x) => x.id === el.dataset.ses), w = S.reloj.find((x) => x.id === el.dataset.ent);
      if (!s || !w) return;
      if (s.reloj) delete s.reloj.sinVinculo;
      await vincular(s, w, "manual");
      toast("Vinculado con " + s.diaTitulo);
      S.sheet = { tipo: "ses", id: s.id }; renderSheet(); renderSafe();
    },
    "reloj-desvincular"(el) {
      const s = S.ses.find((x) => x.id === el.dataset.ses);
      if (!s) return;
      S.reloj.forEach((w) => { if (w.ses === s.id) w.ses = null; });
      if (s.reloj) { delete s.reloj.entreno; delete s.reloj.vinculo; s.reloj.sinVinculo = true; }
      s._pend = true; saveSes(); subir(s); saveReloj();
      toast("Desvinculado"); renderSheet(); renderSafe();
    },
    "cal-mes"(el) {
      const hoy = new Date(), [y, m] = S.ui.calMes || [hoy.getFullYear(), hoy.getMonth()], d = new Date(y, m + +el.dataset.d, 1);
      S.ui.calMes = [d.getFullYear(), d.getMonth()]; S.ui.calDia = null; render();
    },
    "cal-dia"(el) { S.ui.calDia = S.ui.calDia === el.dataset.f ? null : el.dataset.f; render(); },
  });

  /* Hoja para agregar cardio a la sesión: caminadora, escaladora, bici, box… */
  const ICON_CARDIO = { caminadora: "caminar", bicicleta_fija: "bici", bicicleta_aire: "bici", bici_afuera: "bici", caminar_afuera: "caminar", correr_afuera: "correr", natacion: "nadar" };
  HOJAS.cardio = () => {

  };

  /* ═════════ Cuerpo: composición, tendencia, cambios por periodo y medidas ═════════ */
  const METRICAS = [["peso", "Peso"], ["grasa", "% grasa"], ["grasaKg", "Masa grasa"], ["magra", "Masa libre de grasa"], ["musculo", "Músculo"], ["agua", "Agua"], ...MEDIDAS, ["bmr", "Metabolismo basal"]];
  const PER_C = [["bloque", "Bloque"], ["1m", "1 mes"], ["3m", "3 meses"], ["6m", "6 meses"], ["1a", "1 año"], ["todo", "Todo"]];
  const esMedida = (c) => MEDIDAS.some(([k]) => k === c);
  /* Bajar es bueno (true), subir es bueno (false), depende de tu meta (null) */
  function bajarBueno(c, ult) {
    if (c === "grasa" || c === "grasaKg" || c === "cintura") return true;
    if (c === "magra" || c === "musculo" || c === "brazo" || c === "pecho" || c === "muslo" || c === "pantorrilla") return false;
    if (c === "peso") return S.aj.metaPeso != null && ult != null ? S.aj.metaPeso < ult : null;
    return null;
  }
  function serieMet(regs, c, desde) {
    if (c === "grasaKg" || c === "magra") {
      return [...regs].filter((r) => r.peso != null && r.grasa != null && (!desde || new Date(r.fecha + "T12:00:00") >= desde)).sort((a, b) => (a.fecha > b.fecha ? 1 : -1))
        .map((r) => ({ t: r.fecha + "T12:00:00", y: c === "grasaKg" ? (r.peso * r.grasa) / 100 : r.peso * (1 - r.grasa / 100) }));
    }
    return serieCuerpo(regs, c, desde);
  }
  function vCuerpo() {
    const regs = datosCuerpo(), u = uPeso();
    const conv = (c, v) => (esMasa(c) ? kgA(u, v) : v);
    const und = (c) => (esMasa(c) ? u : c === "grasa" ? "%" : c === "bmr" ? "kcal" : "cm");
    const desde = desdePer(S.ui.cPer);
    let h = "";
    if (NAT && !S.ui.ejemplo) h += `<button class="btn sm" data-a="cuerpo-importar">${S.aj.salud ? "Importar de Samsung Health" : "Conectar Samsung Health"}</button>`;
    if (regs.length) {
      // Lo último que tienes
      const ultM = (k) => { const s = serieMet(regs, k); return s.length ? s[s.length - 1] : null; };
      const p = ultM("peso"), g = ultM("grasa"), gk = ultM("grasaKg"), mg = ultM("magra"), mu = ultM("musculo"), bmr = ultM("bmr");
      const tend = p ? tendencia(serieMet(regs, "peso")) : [];
      const fm = mg && S.aj.altura ? ffmi(mg.y, S.aj.altura) : null;
      const tiles = [];
      if (p) tiles.push([fmtN(kgA(u, p.y), 1), "peso (" + u + ")" + (tend.length > 2 ? " · tendencia " + fmtN(kgA(u, tend[tend.length - 1].y), 1) : "")]);
      if (g) tiles.push([fmtN(g.y, 1) + "%", "grasa corporal"]);
      if (gk) tiles.push([fmtN(kgA(u, gk.y), 1), "masa grasa (" + u + ")"]);
      if (mg) tiles.push([fmtN(kgA(u, mg.y), 1), "masa libre de grasa (" + u + ")"]);
      if (mu) tiles.push([fmtN(kgA(u, mu.y), 1), "músculo esquelético (" + u + ")"]);
      if (fm) tiles.push([fmtN(fm.ffmi, 1), "FFMI · " + fmtN(fm.norm, 1) + " ajustado"]);
      if (bmr) tiles.push([fmtN(bmr.y, 0), "kcal de metabolismo basal"]);
      h += `<div class="stats">${tiles.map(([b, s]) => `<div><b class="num">${esc(b)}</b><span>${esc(s)}</span></div>`).join("")}</div>`;
      if (mg && !S.aj.altura) h += `<p class="small dim">Pon tu estatura en Metas para ver tu FFMI (masa libre de grasa por estatura).</p>`;
      // Gráfica de la medida elegida
      const disp = METRICAS.filter(([c]) => serieMet(regs, c).length);
      if (!disp.some(([c]) => c === S.ui.cMet)) S.ui.cMet = disp[0][0];
      const c = S.ui.cMet, nombre = METRICAS.find((x) => x[0] === c)[1];
      const serie = serieMet(regs, c, desde);
      const meta = c === "peso" ? S.aj.metaPeso : c === "grasa" ? S.aj.metaGrasa : null;
      h += `<div class="chips">${disp.map(([k, l]) => `<button class="chip ${c === k ? "on" : ""}" data-a="cmet" data-v="${k}">${l}</button>`).join("")}</div>`;

      if (serie.length) {
        const ult = serie[serie.length - 1], pri = serie[0];
        const conTend = (c === "peso" || c === "grasa" || c === "grasaKg" || c === "magra") && serie.length >= 4;
        const tl = conTend ? tendencia(serieMet(regs, c)).filter((x) => !desde || new Date(x.t) >= desde) : null;
        const pend = serie.length >= 3 ? pendienteSemanal(serieMet(regs, c), 28) : null;
        let ritmo = "";
        if (pend != null && Math.abs(pend) >= 0.01) {
          ritmo = `${pend < 0 ? "Bajando" : "Subiendo"} ${esc(fmtN(Math.abs(conv(c, pend)), c === "grasa" ? 2 : 2))} ${esc(und(c))} por semana (últimas 4 semanas)`;
          const actual = tl && tl.length ? tl[tl.length - 1].y : ult.y;
          if (meta != null && (meta - actual) * pend > 0) {
            const sem = (meta - actual) / pend;
            if (sem < 104) ritmo += ` · a este ritmo llegas a tu meta hacia el ${esc(fechaCorta(sumarDias(new Date(), Math.round(sem * 7)).toISOString()))}`;
          }
        }
        h += `<div class="card"><div class="row between"><h3>${esc(nombre)}</h3><span class="small muted">${fechaCorta(ult.t)}</span></div>
          ${grande(conv(c, ult.y), und(c), serie.length > 1 ? conv(c, ult.y - pri.y) : null, bajarBueno(c, ult.y), serie.length > 1 ? "desde el " + fechaCorta(pri.t) : "", c === "bmr" ? 0 : 1)}
          ${meta != null ? `<p class="meta-txt">Meta ${esc(fmtN(conv(c, meta), 1))} ${und(c)} · ${Math.abs(ult.y - meta) < 0.05 ? "lograda" : "te faltan " + esc(fmtN(Math.abs(conv(c, ult.y - meta)), 1)) + " " + und(c)}</p>` : ""}
          ${chartSVG(serie.map((x) => ({ t: x.t, y: conv(c, x.y) })), { meta: meta != null ? conv(c, meta) : null, metaTxt: meta != null ? "meta" : "", alto: 200, puntos: serie.length < 25, linea: tl ? tl.map((x) => ({ t: x.t, y: conv(c, x.y) })) : null, titulo: nombre })}

      } else h += `<div class="card"><p class="muted">No hay registros de ${esc(nombre.toLowerCase())} en este periodo.</p>${perChips}</div>`;
      h += cardCambios(regs, desde);
    }
    const hoy = fechaLocalISO(new Date());
    h += `<div class="card set-g"><h3>Nuevo registro</h3><div class="form-g">
      <label>Fecha<input class="in" id="c-fecha" type="date" value="${hoy}" max="${hoy}"></label>
      <label>Peso (${u})<input class="in" id="c-peso" inputmode="decimal" autocomplete="off"></label>
      <label>% grasa<input class="in" id="c-grasa" inputmode="decimal" autocomplete="off"></label>
      <label>Músculo esquelético (${u})<input class="in" id="c-musculo" inputmode="decimal" autocomplete="off"></label>
      <label>Agua corporal (${u})<input class="in" id="c-agua" inputmode="decimal" autocomplete="off"></label>
      <label>Cintura (cm)<input class="in" id="c-cintura" inputmode="decimal" autocomplete="off"></label></div>
      <details class="mas"${S.ui.cMedidas ? " open" : ""}><summary>Más medidas con cinta</summary><div class="form-g" style="margin-top:10px">${MEDIDAS.filter(([k]) => k !== "cintura").map(([k, l]) => `<label>${l} (cm)<input class="in" id="c-${k}" inputmode="decimal" autocomplete="off"></label>`).join("")}</div>
      <p class="small dim" style="margin-top:6px">Brazo: contraído en la parte más ancha. Muslo: a media distancia entre cadera y rodilla. Mide siempre en el mismo lugar y a la misma hora.</p></details>
      <p class="small dim">Llena solo lo que tengas. ${WEB ? "La composición sale de tu báscula inteligente o de una medición en el gym." : "La composición sale de la medición de tu Galaxy Watch en Samsung Health."}</p>
      <button class="btn primary" data-a="cuerpo-guardar">Guardar registro</button></div>
      <div class="card set-g"><h3>Metas y estatura</h3><div class="form-g">
      <label>Peso meta (${u})<input class="in" id="m-peso" inputmode="decimal" value="${S.aj.metaPeso != null ? esc(fmtN(kgA(u, S.aj.metaPeso), 1)) : ""}"></label>
      <label>% grasa meta<input class="in" id="m-grasa" inputmode="decimal" value="${S.aj.metaGrasa != null ? esc(S.aj.metaGrasa) : ""}"></label>
      <label>Estatura (cm)<input class="in" id="m-altura" inputmode="decimal" value="${S.aj.altura ? esc(S.aj.altura) : ""}"></label></div>
      <button class="btn sm" data-a="metas-cuerpo">Guardar</button></div>`;
    if (regs.length) {
      h += `<div class="card" style="padding:12px 16px 4px"><h3>Registros</h3><div class="list">${[...regs].sort((a, b) => (a.fecha < b.fecha ? 1 : -1)).slice(0, 80).map((r) => {
        const partes = [r.peso != null ? fmtN(kgA(u, r.peso), 1) + " " + u : null, r.grasa != null ? fmtN(r.grasa, 1) + "% grasa" : null, r.musculo != null ? fmtN(kgA(u, r.musculo), 1) + " " + u + " músculo" : null, r.agua != null ? fmtN(kgA(u, r.agua), 1) + " " + u + " agua" : null,
          ...MEDIDAS.map(([k, l]) => (r[k] != null ? fmtN(r[k], 1) + " cm " + l.toLowerCase() : null)), r.bmr != null ? r.bmr + " kcal basal" : null].filter(Boolean);

  /* Cuánto cambió cada medida en el periodo elegido (bloque, 1 mes…) */
  function cardCambios(regs, desde) {
    const cc = cambiosCuerpo(regs, desde), u = uPeso();
    const filas = [["peso", "Peso", true], ["grasaKg", "Masa grasa", true], ["magra", "Masa libre de grasa", true], ["grasa", "% grasa", false], ["musculo", "Músculo esquelético", true], ["agua", "Agua", true], ...MEDIDAS.map(([k, l]) => [k, l, false])]

    if (!filas.length) return `<div class="card"><h3>Cambios · ${esc(per ? per[1].toLowerCase() : "todo")}</h3><p class="small muted">Necesitas al menos dos registros en el periodo para ver cuánto cambiaste.</p></div>`;
    const conv = (k, v) => (esMasa(k) ? kgA(u, v) : v), und = (k) => (esMasa(k) ? u : k === "grasa" ? "%" : "cm");
    let h = `<div class="card" style="padding:12px 16px 6px"><div class="row between"><h3>Cambios · ${esc(S.ui.cPer === "bloque" ? RUT.nombre : per ? per[1].toLowerCase() : "todo")}</h3></div><div class="list">${filas.map(([k, l]) => {
      const x = cc[k], d = x.a - x.de, bien = bajarBueno(k, x.a);
      const cls = Math.abs(d) < 0.05 ? "" : bien == null ? "" : (d < 0) === bien ? "sube" : "baja";
      return `<div class="li"><div class="li-t"><b class="small">${esc(l)}</b><span class="num">${esc(fmtN(conv(k, x.de), 1))} → ${esc(fmtN(conv(k, x.a), 1))} ${esc(und(k))} · ${fechaCorta(x.desde + "T12:00:00")} a ${fechaCorta(x.hasta + "T12:00:00")}</span></div><span class="pct ${cls}">${Math.abs(conv(k, d)) < 0.05 ? "±0" : (d < 0 ? "−" : "+") + esc(fmtN(Math.abs(conv(k, d)), 1))}</span></div>`;

    if (cc.grasaKg && cc.magra && cc.grasaKg.n >= 2) {

  }

  Object.assign(A, {
    "cuerpo-guardar"() {
      const u = uPeso(), g = (id) => num((document.getElementById(id) || {}).value);
      const fecha = (document.getElementById("c-fecha") || {}).value || fechaLocalISO(new Date());

      let ex = S.cuerpo.find((x) => x.fecha === fecha);

  document.addEventListener("toggle", (e) => { if (e.target.classList && e.target.classList.contains("mas")) S.ui.cMedidas = e.target.open; }, true);

  /* Novedades de esta versión (se muestran una vez) */
  HOJAS.novedades = () => {

    return `<div class="sheet-h"><div><p class="eyebrow">Heavy Gym ${VERSION}</p><h2>Lo nuevo</h2></div>${xBtn()}</div>

      await recuperar(K.cuerpo, !S.cuerpo.length, (arr) => { S.cuerpo = arr; LS.set(K.cuerpo, arr); });
      await recuperar(K.reloj, !S.reloj.length, (arr) => { S.reloj = arr; LS.set(K.reloj, arr); });
      await recuperar(K.rut, S.rutinasSemilla, (arr) => { if (Array.isArray(arr)) { S.rutinas = arr; LS.set(K.rut, arr); cargarRutinas(); } });
      if (LS.get(K.aj, null) === null) {
        const v = await NAT.prefGet(K.aj);
        try { const o = v && JSON.parse(v); if (o && typeof o === "object") { Object.assign(S.aj, o); LS.set(K.aj, S.aj); renderSafe(); } } catch (e) { /* */ }
      }
      const ev = NAT.enVivo ? await NAT.enVivo.estado() : null;
      if (ev) S.ui.enVivoChip = ev.chip;
      await revisarSalud();
      mostrarNovedades();
      if (S.aj.salud) sincronizarReloj(true);
    })();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.aj.salud) sincronizarReloj(true); });
  } else setTimeout(mostrarNovedades, 400);
  if (WEB) { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* */ } }

})();
</script>
